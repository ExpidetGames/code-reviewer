[project]
name = "code-reviewer-runner"
version = "0.1.0"
description = "Worker that picks up review jobs from the Code Reviewer app and runs PR-Agent."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "pr-agent==0.47.0",
]

[project.scripts]
code-reviewer-runner = "code_reviewer_runner.cli:main"
code-reviewer-run-job = "code_reviewer_runner.runner:main"
code-reviewer-worker = "code_reviewer_runner.worker_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_reviewer_runner"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-socket",
    "pytest-timeout",
    "ruff",
    "pyright",
    "jsonschema",
    "pyjwt>=2.15.1",
    "cryptography>=50.0.2",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Network guard: only loopback is reachable. Unix sockets stay allowed (asyncio needs them).
# engine tests (the real PR-Agent against loopback fakes) and privileged tests (root, the dedicated
# engine user, nft) are deselected unless asked for with -m engine / -m privileged.
addopts = [
    "--strict-markers",
    "--disable-socket",
    "--allow-unix-socket",
    "--allow-hosts=127.0.0.1,::1,localhost",
    "-m",
    "not engine and not privileged",
]
filterwarnings = [
    # pytest-socket warns about every blocked connection; the tests assert the block themselves.
    "ignore:A test tried to use socket.socket.connect\\(\\):UserWarning",
    # Raised while PR-Agent itself is imported; not ours to fix.
    "ignore:Support for class-based `config` is deprecated:DeprecationWarning",
]
markers = [
    "unit: pure logic on the host, no real process or network (default level)",
    "integration: real processes or real sockets on loopback",
    "contract: pins the runner API and webhook shapes against the shared contract files",
    "engine: real PR-Agent against the loopback fakes (deselected by default)",
    "privileged: root with the production capabilities, the dedicated engine user and nft (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The fixed core is a prompt asset embedded in code (#198): each rule is a single logical line, so
# its physical lines are intentionally longer than the lint limit.
"src/code_reviewer_runner/dynamic_review/prompt_core.py" = ["E501"]

[tool.pyright]
include = ["src", "tests", "scripts", "../fakes"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
extraPaths = ["src", "..", "tests/engine"]
venvPath = "."
venv = ".venv"
