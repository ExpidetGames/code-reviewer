# Minimal reverse proxy for compose.large.yml: forward everything to the app over the compose
# network. The operator is expected to replace this with their own server block (TLS on 443, a real
# server_name, timeouts) — docs/deployment-large.md, section 6. This default is plain HTTP behind the
# proxy's published port and needs no change to start the example.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
