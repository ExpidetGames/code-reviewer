# Override file of docker/smoke/compose.sh, only for its "stop while a review is running" step. It is
# never shipped and never used in a deployment: it replaces the app's runner API by a fake that hands
# out one job, and PR-Agent by a fake that never finishes, so that `docker compose stop` meets a
# running review. The real app of the stack keeps running next to it (the runner still waits for it).
#
# Use: docker compose -f compose.yml -f docker/smoke/compose.fake-job.yml ...   (see compose.sh)
# The fakes are copied to ./smoke-fakes next to the compose file by compose.sh.
services:
  fake-api:
    image: ${RUNNER_IMAGE:?}
    entrypoint: ["python", "-u", "/smoke/fake_runner_api.py", "8080"]
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?}
    volumes:
      - ./smoke-fakes:/smoke:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 1s

  runner:
    depends_on:
      fake-api:
        condition: service_healthy
    environment:
      RUNNER_API_URL: http://fake-api:8080
      PR_AGENT_COMMAND: python /smoke/fake_job.py
      # Shorter than the 60 seconds of the shipped files, so the step does not take a minute: what it
      # proves is that Docker waits for the loop (stop_grace_period) instead of killing it after 10 s.
      RUNNER_SHUTDOWN_GRACE_SECONDS: "20"
    volumes:
      - ./smoke-fakes:/smoke:ro
