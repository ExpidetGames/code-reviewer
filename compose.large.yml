# Code Reviewer, the large topology: an external Postgres, several stateless app replicas and several
# runner workers, behind a reverse proxy. See docs/deployment-large.md for the whole picture, the
# variables to set and what to back up. The small topology stays compose.yml.
#
#   DATABASE_URL is built here from POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB, so the app and the
#   database agree on it. Set APP_SECRET, RUNNER_TOKEN, BETTER_AUTH_URL and POSTGRES_PASSWORD; a
#   missing required value stops `up` with a message naming the variable, before any container runs.
#
#   docker compose -f compose.large.yml up -d --wait
#
#   The first-run setup is per process (ADR 2.2): start ONE app replica, finish the setup, then scale
#   the app out (the runners may already run several). After the setup:
#   docker compose -f compose.large.yml up -d --scale app=2 --wait
#
# No secret is written in this file: every value is a reference to the environment or to `.env`.
name: code-reviewer-large

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    restart: unless-stopped
    volumes:
      # The database of every app instance and runner lives here. Back it up separately from APP_SECRET
      # (docs/deployment-large.md, "Backups").
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-code_reviewer}
      POSTGRES_DB: ${POSTGRES_DB:-code_reviewer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see docs/deployment-large.md}
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-code_reviewer} -d ${POSTGRES_DB:-code_reviewer}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No published port: only the app and the runners reach it, over the compose network.

  app:
    image: ${APP_IMAGE:-code-reviewer-app:local}
    restart: unless-stopped
    # Start with ONE replica: the first-run setup (the setup code and its session) lives in one
    # process, so it must be done on a single instance (ADR 2.2). After the setup, scale out with
    # `--scale app=2` (docs/deployment-large.md). Then the replicas are interchangeable: they share
    # the Postgres database and APP_SECRET, so a session or a setting made on one is seen by the
    # others. No published port: the proxy is the only way in.
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required, see docs/deployment-large.md}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # The public address of the app, behind the proxy (the sessions, links and the GitHub App
      # callback are bound to it).
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required, see docs/deployment-large.md}
      # The database, built from the same variables the postgres service reads.
      DATABASE_URL: postgres://${POSTGRES_USER:-code_reviewer}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see docs/deployment-large.md}@postgres:5432/${POSTGRES_DB:-code_reviewer}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      # Imported once by an update, then ignored: see compose.yml and .env.example.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      ALLOWED_GITHUB_LOGINS: ${ALLOWED_GITHUB_LOGINS:-}
      ALLOWED_GITHUB_ORG: ${ALLOWED_GITHUB_ORG:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?RUNNER_TOKEN is required, see docs/deployment-large.md}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      # Backups: with Postgres the operator backs up the database, the app schedules nothing
      # (docs/deployment-large.md, "Backups"). BACKUP_TIME and BACKUP_DIR do not exist here.
      # Optional. The daily read of the public model catalog (src/models-dev/README.md): where it is read from (empty:
      # https://models.dev/api.json, or a mirror) and whether it is read at all (`off`, for an air-gapped instance).
      MODELS_DEV_URL: ${MODELS_DEV_URL:-}
      MODELS_DEV_FETCH: ${MODELS_DEV_FETCH:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  runner:
    image: ${RUNNER_IMAGE:-code-reviewer-runner:local}
    restart: unless-stopped
    # Several workers share one Postgres queue: the claim hands each job to exactly one worker.
    deploy:
      replicas: 2
    mem_limit: ${RUNNER_MEMORY_LIMIT:-2g}
    stop_grace_period: 90s
    depends_on:
      app:
        condition: service_healthy
    environment:
      RUNNER_API_URL: http://app:3000
      RUNNER_TOKEN: ${RUNNER_TOKEN:?RUNNER_TOKEN is required, see docs/deployment-large.md}
      RUNNER_CONCURRENCY: ${RUNNER_CONCURRENCY:-3}
      RUNNER_JOB_TIMEOUT_SECONDS: ${RUNNER_JOB_TIMEOUT_SECONDS:-1200}
      RUNNER_POLL_INTERVAL_SECONDS: ${RUNNER_POLL_INTERVAL_SECONDS:-5}
      RUNNER_ID: ${RUNNER_ID:-}

  # A reverse proxy sketch. In production use your own (nginx, Caddy, Traefik, a cloud load
  # balancer): terminate TLS here, forward to `app:3000`, and keep a health check on /api/health. The
  # default `docker/proxy/default.conf` forwards everything to the app; replace it with your own
  # (set PROXY_CONFIG_DIR) for TLS and a real server_name (docs/deployment-large.md, section 6).
  proxy:
    image: ${PROXY_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:80"
    depends_on:
      app:
        condition: service_healthy
    command:
      - nginx
      - -g
      - "daemon off;"
    # The default config in docker/proxy/default.conf forwards to the app; mount your own directory
    # (set PROXY_CONFIG_DIR) for TLS and a real server_name.
    volumes:
      - ${PROXY_CONFIG_DIR:-./docker/proxy}:/etc/nginx/conf.d:ro

volumes:
  postgres:
