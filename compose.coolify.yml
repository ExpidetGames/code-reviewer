# Code Reviewer on Coolify. This is the Compose file of a Coolify "Docker Compose" application that is
# built from this repository (Docker Compose Location: /compose.coolify.yml). The step by step guide
# is docs/deployment-coolify.md; read it before changing anything here.
#
# How it differs from compose.yml (the file for one machine without a proxy), and why:
#   - The images are built on the Coolify server from the checkout (build:), not pulled from GHCR:
#     the GHCR packages are private, and a registry login on the server would be one more long lived
#     credential. A token that expires there also breaks Coolify's own pulls from ghcr.io.
#   - No host port is published (no ports: key). Coolify's proxy reaches the app over the Docker network; the domain
#     goes into Coolify's "Domains" field of the service app with the port, https://<domain>:3000.
#     A published host port would bypass the proxy (and its TLS).
#   - BETTER_AUTH_URL has no default: it must be the public https address, and Coolify refuses to
#     deploy while a required variable (written with :? after its name) is empty. The same holds for
#     RUNNER_TOKEN. The app itself requires APP_SECRET (or its deprecated name BETTER_AUTH_SECRET).
#     Nothing else is required: GitHub is optional, and the rest of the setup is done in the browser
#     with the setup code from the log of the app.
#   - Every value is a reference to a variable. Coolify turns each reference into a variable under
#     "Environment Variables"; no value is written in this file.
#
# Everything else (services, volumes, restart policy, health check, runner wiring) is the same as in
# compose.yml. app/src/ci/coolify-compose.test.ts fails when the two files drift apart.
#
# The one service compose.yml does not have is runner-dynamic, the Dynamic Review runner (#264). Coolify
# takes ONE Compose file per resource, so it lives here: the resource that deploys this file builds
# and starts it with the rest after a release, with no second resource and no new variable. It is the
# runner-dynamic service of compose.dynamic.yml (app/src/ci/compose-dynamic.test.ts fails when they
# drift apart) except for the image name. It runs no Dynamic review until the instance admin turns the Dynamic
# Review gate on (default off, a switch of the app); until then it claims no Dynamic job, so no
# project's review kind changes. It does take Diff jobs from the first deployment, like the runner
# above (so its 2 GiB are in use whenever one runs there), and once the gate is on a Diff job can
# occupy its single slot. If the host cannot give it
# what it needs (no nf_tables, a capability that Coolify drops) it logs why and serves Diff jobs
# only; the app and the runner above do not depend on it. The engine is pinned for x86_64 only: on an
# arm64 server the image still builds, without an engine, and the runner serves Diff jobs only. It has NOT been tested on a real Coolify
# instance; read docs/deployment-coolify.md ("Dynamic Review runner") before the first deployment. A
# self-hoster who does not want it deletes the service from their copy of this file.
services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      # The SQLite database (/data/app.db). Survives a redeploy; deleted only when the volume is.
      - data:/data
      # The daily backups (BACKUP_DIR=/backups, fixed by the image), apart from the data. To get them
      # off the server see docs/deployment-coolify.md.
      - backups:/backups
    environment:
      # The master key: required, but checked by the app (it refuses to start and names the variable)
      # rather than by Coolify, because BETTER_AUTH_SECRET, its deprecated name, is still accepted when
      # APP_SECRET is empty: an existing deployment keeps deploying with the values it has.
      APP_SECRET: ${APP_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
      # Legacy variables of an installation from before accounts (imported once by the update, see
      # docs/deployment-coolify.md, "Updating an installation from before accounts"). Optional.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      # Not enforced any more (the sign-up rule in the admin portal decides). They are passed through
      # only for the one-time import of the update to accounts: it reads them once to decide who becomes
      # a member of the default workspace, then ignores them (the log names them, never their values).
      ALLOWED_GITHUB_LOGINS: ${ALLOWED_GITHUB_LOGINS:-}
      ALLOWED_GITHUB_ORG: ${ALLOWED_GITHUB_ORG:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      # The runner presents the same token; both services read the one variable.
      RUNNER_TOKEN: ${RUNNER_TOKEN:?}
      # Optional. The bearer token of the operator API (/api/operator/v1, src/operator-api/README.md). Empty or
      # unset: the API does not exist (404). At least 32 characters, different from RUNNER_TOKEN, APP_SECRET and BETTER_AUTH_SECRET.
      OPERATOR_API_TOKEN: ${OPERATOR_API_TOKEN:-}
      # Legacy: the shared LLM key of an installation from before accounts. The update imports it once
      # into the default workspace and ignores it afterwards; every workspace enters its own key in the
      # UI. Not needed for the stack to start: without a key a workspace's review jobs fail with the
      # stable error code llm_not_configured. LLM_MODEL and LLM_MAX_TOKENS stay instance settings.
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      # Optional, default off. 1, true or on runs Dynamic reviews on OpenRouter and Anthropic through the native OpenCode
      # path (#578, docs/dynamic-review.md). Read at every claim.
      NATIVE_OPENCODE_PROVIDERS: ${NATIVE_OPENCODE_PROVIDERS:-}
      DATABASE_BUSY_TIMEOUT_MS: ${DATABASE_BUSY_TIMEOUT_MS:-}
      # When the app backs up the database every day (HH:MM, UTC), or "off". Empty: the default.
      BACKUP_TIME: ${BACKUP_TIME:-}
      # Optional. The daily read of the public model catalog (src/models-dev/README.md): where it is read from (empty:
      # https://models.dev/api.json, or a mirror) and whether it is read at all (`off`, for an air-gapped instance).
      MODELS_DEV_URL: ${MODELS_DEV_URL:-}
      MODELS_DEV_FETCH: ${MODELS_DEV_FETCH:-}
    healthcheck:
      # Node is in the image, curl is not. /api/health is public and reads the database. A Compose
      # health check is the only kind Coolify uses for a Compose application.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    restart: unless-stopped
    # No port and no domain: the runner only talks to the app, over the Docker network.
    # The memory the runner may use as a whole: 2 GiB by default, the figure the number of parallel
    # reviews (RUNNER_CONCURRENCY, about 1.5 per GiB) is calculated from, see docs/deployment-coolify.md,
    # section 9, for the pairs to choose from. A review needs about 320 MB; without a limit too many at
    # once could take the whole server's memory. Change both settings together.
    mem_limit: ${RUNNER_MEMORY_LIMIT:-2g}
    # `docker compose stop` and a redeploy send SIGTERM. The loop then stops claiming, gives running
    # reviews 60 seconds to finish (RUNNER_SHUTDOWN_GRACE_SECONDS, not passed on here so that it cannot
    # outgrow this value), reports what is left as runner_shutdown, and exits. Docker's default of 10
    # seconds would kill it before the reports are sent; 90 = 60 + 5 between SIGTERM and SIGKILL of a
    # stuck job + up to 10 to report + margin. The image's tini passes the signal on (no `init: true`).
    stop_grace_period: 90s
    depends_on:
      app:
        condition: service_healthy
    environment:
      # The image's own entry point is the job loop (runner/README.md, "The job loop").
      RUNNER_API_URL: http://app:3000
      RUNNER_TOKEN: ${RUNNER_TOKEN:?}
      # Reviews at the same time: about 1.5 per GiB of the memory limit above (docs/deployment-coolify.md,
      # section 9). Hard timeout of one review in seconds. Wait between two claims in seconds.
      RUNNER_CONCURRENCY: ${RUNNER_CONCURRENCY:-3}
      RUNNER_JOB_TIMEOUT_SECONDS: ${RUNNER_JOB_TIMEOUT_SECONDS:-1200}
      RUNNER_POLL_INTERVAL_SECONDS: ${RUNNER_POLL_INTERVAL_SECONDS:-5}
      # A name for this runner in the app's logs. Empty: runner-<container host name>.
      RUNNER_ID: ${RUNNER_ID:-}

  # The Dynamic Review runner (#264). The service of compose.dynamic.yml, built like the other two.
  runner-dynamic:
    # Built on the Coolify server from the checkout: the `dynamic` target of the runner Dockerfile
    # (the Diff runner above is its default target, so the shared layers are built once).
    build:
      context: .
      dockerfile: runner/Dockerfile
      target: dynamic
    restart: unless-stopped
    # No published port: the runner only talks to the app, over the Docker network.
    # One job at a time is one Dynamic slot. The spike (docs/spike/85-opencode-dynamic-review.md)
    # recommends at least 1 GiB per Dynamic slot plus the runner and proxy reserve; the default
    # limit is 2 GiB with 1.5 GiB reserved. Whole-job peaks are not measured yet: do not raise the
    # concurrency without the worst-case/OOM measurements (docs/dynamic-review.md). This is on top
    # of the 2 GiB of the runner above: docs/deployment-coolify.md, section 9.
    mem_limit: ${RUNNER_DYNAMIC_MEMORY_LIMIT:-2g}
    mem_reservation: ${RUNNER_DYNAMIC_MEMORY_RESERVATION:-1536m}
    # No swap: the cgroup peak must show up as an OOM kill of this job, not as a slow host.
    memswap_limit: ${RUNNER_DYNAMIC_MEMORY_LIMIT:-2g}
    # A bounded number of processes for the job, the engine and its helpers.
    pids_limit: 512
    # The loop and the Dynamic job process run as root: the job process is the SUPERVISOR that
    # prepares the read-only export, owns every credential and the model proxy, and starts the
    # engine as a different, unprivileged user (#197, docs/dynamic-review.md "The engine boundary").
    # Diff jobs are dropped to uid 10001 by the loop (RUNNER_DIFF_JOB_USER), so PR-Agent never
    # runs as root. Root here holds exactly the capabilities below and nothing else: the engine user
    # has none, and no-new-privileges means no program can regain one.
    #
    # Nothing is mounted from outside and nothing is shared with the host or another container: no
    # `volumes`, no `network_mode`, `pid` or `ipc`, no Docker socket. A unix socket cannot leave the
    # container, and the engine user's nft rules do not cover AF_UNIX, so this is what keeps that gap
    # empty (app/src/ci/compose-dynamic.test.ts fails the day one of them is added, #244). The only
    # mounts are the three private tmpfs below.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - SETUID # start the engine as the dedicated user (setuid in the child; no sudo, no helper)
      - SETGID # the same, for its group and no supplementary group
      - KILL # end the engine's process group and everything else that user runs
      - CHOWN # seal the read-only export for the engine user (#196)
      - DAC_OVERRIDE # remove the sealed 0550 export and the tree the engine user filled
      - FOWNER # remove entries of that tree in sticky directories
      # The next two exist for STARTUP ONLY (#244, ADR 0003). The container is created with exactly
      # this set, so they must be listed; the runner's entry point installs the engine user's static
      # nft rules (its proxy and its own port, nothing else), then drops both from every capability
      # set and from the bounding set, before the job loop and any thread exists. A job process,
      # the supervisor and the engine never hold them (the privileged suite proves it); if the drop
      # fails the runner refuses to start.
      - NET_ADMIN # install the engine user's static nft rules once, at container start
      - SETPCAP # drop NET_ADMIN (and itself) from the bounding set right after
    security_opt:
      - no-new-privileges:true
    # A read-only root filesystem (#249, ADR 0003 decision 5). NET_ADMIN and SETPCAP are dropped for
    # the life of the container, but `restart: unless-stopped` starts a new one with them again, so
    # a compromised root supervisor (it holds DAC_OVERRIDE) must not be able to change `nft`, `tini`
    # or the runner source and then crash the container. Nothing is written to the image: the only
    # writable paths are these three private tmpfs, empty again after every restart, none able to run
    # a program, honour a setuid bit or hold a device. A tmpfs is charged to mem_limit, hence the
    # sizes. The engine user (10101) gains no write path: /tmp is world-writable as it is in the
    # image, /run is root's (0755) and /home/runner is 10001's (0700).
    #   /tmp          job working directories, the per-job export, the engine's HOME, XDG and TMPDIR
    #   /run          the identity leases of the checkout
    #   /home/runner  HOME of the Diff job user 10001 (PR-Agent, git) and of the root loop
    # The test pins these exact strings (and docker/smoke/runner.sh runs the image with them).
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=1m,mode=0755
      - /home/runner:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
    stop_grace_period: 90s
    depends_on:
      app:
        condition: service_healthy
    environment:
      RUNNER_API_URL: http://app:3000
      # The loop is root here, so the home of the unprivileged job user is set explicitly.
      HOME: /home/runner
      RUNNER_DIFF_JOB_USER: "10001:10001"
      # The same token as the runner above and the app: one variable.
      RUNNER_TOKEN: ${RUNNER_TOKEN:?}
      RUNNER_CONCURRENCY: ${RUNNER_DYNAMIC_CONCURRENCY:-1}
      RUNNER_JOB_TIMEOUT_SECONDS: ${RUNNER_JOB_TIMEOUT_SECONDS:-1200}
      RUNNER_POLL_INTERVAL_SECONDS: ${RUNNER_POLL_INTERVAL_SECONDS:-5}
      # Optional ceiling (JSON) for the model description the app sends with each Dynamic job from
      # OpenRouter's model metadata (#279). Empty is the normal case and keeps this default valid: any
      # tool-capable model runs, and the runner carries the description of the default model
      # (deepseek/deepseek-v4.1-flash) built in as a fallback when the app sent none. A value set here
      # can only narrow what a job brings (docs/dynamic-review.md, "The model").
      RUNNER_DYNAMIC_CAPABILITIES: ${RUNNER_DYNAMIC_CAPABILITIES:-}
      # The most one Dynamic run may cost, in USD (the operator's cost limit, docs/dynamic-review.md).
      # Empty is the normal case: the runner's default applies. Trusted runner configuration with a
      # hard ceiling in the runner; nothing in a repository or a pull request can raise it.
      RUNNER_DYNAMIC_MAX_COST_USD: ${RUNNER_DYNAMIC_MAX_COST_USD:-}

volumes:
  data:
  backups:
