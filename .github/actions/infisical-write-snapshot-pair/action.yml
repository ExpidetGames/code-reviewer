name: Write the golden snapshot pair to Infisical
description: >-
  Writes SANDBOX_SNAPSHOT_ID, SANDBOX_IMAGE_DIGEST and SANDBOX_SNAPSHOT_COMMIT to Infisical prod /dispatcher with the
  repository's machine identity, through `pnpm snapshot:ops persist` (dispatcher/src/snapshot/ops-cli.ts). The pair is
  either given (the snapshot a deployment has just made live) or read from the meta of a deployment (a rollback). This is
  the only write path to Infisical of the repository: only the persist job of deploy-production.yml and the rollback
  workflow use it, and the identity's role should allow nothing else (docs/deployment-vercel.md, section 2.1).

# Needs the repository checked out, Node.js and pnpm set up and the dispatcher installed (`pnpm install --frozen-lockfile --filter code-reviewer-dispatcher...`). The caller
# passes the four Infisical settings in (a composite action cannot read secrets).

inputs:
  client-id:
    description: The secret INFISICAL_CLIENT_ID of the environment production
    required: true
  client-secret:
    description: The secret INFISICAL_CLIENT_SECRET of the environment production
    required: true
  domain:
    description: The secret INFISICAL_DOMAIN of the environment production
    required: true
  project-slug:
    description: The secret INFISICAL_PROJECT_SLUG of the environment production
    required: true
  snapshot-id:
    description: The snapshot id to write (with image-digest and commit), when no deployment is given
    required: false
    default: ""
  image-digest:
    description: The Worker image id to write
    required: false
    default: ""
  commit:
    description: The commit the snapshot was built from
    required: false
    default: ""
  from-deployment:
    description: A deployment (id or address) of the Dispatcher project whose pair is written instead, for a rollback
    required: false
    default: ""
  vercel-project-id:
    description: The Dispatcher project's id, needed with from-deployment
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Write the pair
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INFISICAL_CLIENT_ID: ${{ inputs.client-id }}
        INFISICAL_CLIENT_SECRET: ${{ inputs.client-secret }}
        INFISICAL_DOMAIN: ${{ inputs.domain }}
        INFISICAL_PROJECT_SLUG: ${{ inputs.project-slug }}
        PAIR_SNAPSHOT_ID: ${{ inputs.snapshot-id }}
        PAIR_IMAGE_DIGEST: ${{ inputs.image-digest }}
        PAIR_COMMIT: ${{ inputs.commit }}
        FROM_DEPLOYMENT: ${{ inputs.from-deployment }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      run: |
        set -euo pipefail
        args=(persist)
        if [ -n "${FROM_DEPLOYMENT}" ]; then
          args+=(--from-deployment "${FROM_DEPLOYMENT}")
        fi
        pnpm --dir dispatcher snapshot:ops "${args[@]}"
