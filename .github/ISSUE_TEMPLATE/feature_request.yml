name: Feature request
description: Suggest an idea or an improvement.
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please search the existing issues first. A request that starts from a
        problem is easier to discuss than one that starts from a solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? A rough idea is enough.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem, including workarounds you use now.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps, such as examples from other tools. Do not include secrets.
    validations:
      required: false
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this and open a pull request.
