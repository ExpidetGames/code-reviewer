name: Question
description: Ask how to set up, configure or use code-review.com.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Please read the README and the guides in the docs folder first. Never paste API keys,
        tokens, private keys or `.env` files into this form.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What do you want to know, and what have you tried so far?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag or commit you run, if it matters for your question.
    validations:
      required: false
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      options:
        - Docker Compose
        - Coolify
        - Local development (pnpm dev and uv)
        - Other
        - Not applicable
    validations:
      required: false
