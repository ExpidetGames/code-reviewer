name: CI

# Pull requests into development and main, and pushes to development and main. No repository
# secrets are used. The single required status check is "ci-passed" (see TESTING.md, section CI):
# path-skipped jobs never block a merge because it accepts skipped jobs.
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

# A new push to a pull request cancels the superseded run. Runs for pushes are never cancelled or
# replaced: their group contains the commit hash, so every pushed commit gets its own run (with a
# shared group GitHub would drop all but the newest waiting run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  # Decides which parts a pull request touches. The filter step only runs on pull requests (it
  # reads the changed files through the API, so no checkout is needed). Pushes and pull requests
  # into main run every job: the job conditions below handle that and ignore the filter outputs.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      runner: ${{ steps.filter.outputs.runner }}
      workflows: ${{ steps.filter.outputs.workflows }}
      licenses: ${{ steps.filter.outputs.licenses }}
    steps:
      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            app:
              - '**'
              - '!runner/**'
              - '!*.md'
              - '!fakes/**/*.md'
            runner:
              - '**'
              - '!app/**'
              - '!**/*.md'
            workflows:
              - '.github/**'
            # The Markdown exclusions above skip this file, but the license check compares it with
            # license-policy.json (policy-doc.test.ts).
            licenses:
              - 'THIRD_PARTY_LICENSES.md'

  app-fast:
    name: "App: static, unit tests & build"
    needs: changes
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' || needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Integration tests on the host
        run: pnpm test:int
      - name: Build
        # Placeholder environment for the production build. Required settings get a dummy value
        # here when they are introduced (for example the database path); real values never belong
        # in CI.
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

  runner-fast:
    name: "Runner: static & tests"
    needs: changes
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' || needs.changes.outputs.runner == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v7
      # The Python version comes from runner/.python-version, which uv reads from the working
      # directory.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: runner/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . ../fakes
      - name: Check formatting
        run: uv run ruff format --check . ../fakes
      - name: Typecheck
        run: uv run pyright
      - name: Unit tests
        run: uv run pytest -m unit
      - name: Integration and contract tests on the host
        run: uv run pytest -m "integration or contract"

  # The engine suite: the real, pinned PR-Agent against a fake GitHub and a fake LLM
  # (runner/tests/engine), defined once in engine.yml. No Docker stack: the fakes are loopback
  # servers the tests start themselves. Runs for pull requests that change the runner and for pull
  # requests into main; nightly.yml runs the same suite on development. A skipped job never blocks
  # a merge, a failed one does (ci-passed).
  engine:
    name: "Runner: engine tests"
    needs: changes
    if: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' || needs.changes.outputs.runner == 'true') }}
    permissions:
      contents: read
    uses: ./.github/workflows/engine.yml

  # The journey with the real runner and the real PR-Agent (app/e2e/jobs) is part of these, so a
  # change to the runner runs them too.
  e2e:
    name: "E2E: browser journeys"
    needs: changes
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' || needs.changes.outputs.app == 'true' || needs.changes.outputs.runner == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the browser and its system libraries
        run: pnpm exec playwright install --with-deps chromium
      # The journey app/e2e/jobs starts the real runner (a process per journey) and the real
      # PR-Agent: the runner from its locked environment, and the tiktoken encoding PR-Agent counts
      # tokens with from the cache (the one step that needs the internet, as in engine.yml).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: runner/uv.lock
      - name: Install the runner
        working-directory: runner
        run: uv sync --locked
      - name: Restore the tiktoken encoding
        uses: actions/cache@v4
        with:
          path: /tmp/data-gym-cache
          key: tiktoken-o200k_base-v1
      - name: Prime the tiktoken cache
        working-directory: runner
        run: uv run python scripts/prime_tiktoken_cache.py
      # Playwright builds the app and serves the production build itself (playwright.config.ts).
      # Pull requests into development run the smoke journeys, everything else
      # (release pull requests into main, pushes) runs all journeys. Journeys tagged @flaky are
      # quarantined and only run in the nightly workflow.
      - name: Run the smoke journeys
        if: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm test:e2e --grep @smoke --grep-invert @flaky
      - name: Run all journeys
        if: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm test:e2e --grep-invert @flaky
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14
          if-no-files-found: ignore

  # The dependency license check (license-policy.json, app/src/ci/license-check): fails when a
  # package of pnpm-lock.yaml or uv.lock has a license outside the allow list. It reads the license
  # metadata that pnpm and uv installed, so it needs both parts installed from the lockfiles and no
  # network service. Runs for every code change, because the policy, the lockfiles and the check
  # itself live in both parts, and for a change to THIRD_PARTY_LICENSES.md. Besides the check it runs
  # the tests that keep that file and the policy together, and the SPDX header check, which are
  # app tests that a runner-only pull request would otherwise skip.
  licenses:
    name: "Licenses: dependency check"
    needs: changes
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' || needs.changes.outputs.app == 'true' || needs.changes.outputs.runner == 'true' || needs.changes.outputs.licenses == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install the app dependencies
        run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: runner/uv.lock
      - name: Install the runner dependencies
        working-directory: runner
        run: uv sync --locked
      - name: Check the licenses of all dependencies
        run: pnpm licenses:check
      # The tests that hold THIRD_PARTY_LICENSES.md and the policy together, and the SPDX header of
      # every source file (also those of a pull request that only touches the runner, for which
      # app-fast is skipped).
      - name: Check that the license documentation agrees with the policy
        run: pnpm exec vitest run --project unit src/ci/license-check
      - name: Check the SPDX headers
        run: pnpm spdx:check

  # The container images (see publish-images.yml for how they reach GHCR). A pull request builds
  # each image, starts it and checks what a unit test cannot (docker/smoke/*.sh). Nothing is
  # pushed here: these jobs have no login and only the read-only token of the workflow. Pushes to
  # development and main build the images in the publish workflow instead.
  image-app:
    name: "Image: app build & smoke test"
    needs: changes
    if: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          load: true
          push: false
          tags: code-reviewer-app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Smoke test the image
        run: docker/smoke/app.sh code-reviewer-app:ci

  image-runner:
    name: "Image: runner build & smoke test"
    needs: changes
    if: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' || needs.changes.outputs.runner == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: runner/Dockerfile
          load: true
          push: false
          tags: code-reviewer-runner:ci
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
      - name: Smoke test the image
        run: docker/smoke/runner.sh code-reviewer-runner:ci

  # The Docker Compose stack (compose.yml): both images are built here and the stack is started
  # with dummy settings by docker/smoke/compose.sh. Nothing is pushed; the job has no login and only
  # the read-only token of the workflow. Pushes to development and main are covered by the publish
  # workflow, which smoke tests the same images.
  compose:
    name: "Compose: stack smoke test"
    needs: changes
    if: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' || needs.changes.outputs.app == 'true' || needs.changes.outputs.runner == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          load: true
          push: false
          tags: code-reviewer-app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build the runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: runner/Dockerfile
          load: true
          push: false
          tags: code-reviewer-runner:ci
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
      - name: Smoke test the stack
        run: docker/smoke/compose.sh code-reviewer-app:ci code-reviewer-runner:ci
      # The database and the environment of the previous release, started with the image just built.
      - name: Smoke test the update from the previous release
        run: docker/smoke/upgrade.sh code-reviewer-app:ci

  actionlint:
    name: Lint workflow files
    needs: changes
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Uses .github/actionlint.yaml. The image bundles shellcheck for the run steps.
      - name: Run actionlint
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  # The only check that branch protection requires. It runs even when jobs fail or are skipped,
  # fails on any failed or cancelled job and accepts skipped jobs (path filter).
  ci-passed:
    name: All checks passed?
    needs: [changes, app-fast, runner-fast, engine, e2e, licenses, image-app, image-runner, compose, actionlint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Show the result of every job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"
      - name: Fail if a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
