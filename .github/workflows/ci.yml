name: CI

# Pull requests into development and main, and pushes to development and main. No repository
# secrets are used. The single required status check is "ci-passed" (see TESTING.md, section CI):
# path-skipped jobs never block a merge because it accepts skipped jobs.
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

# A new push to a pull request cancels the superseded run. Runs for pushes are never cancelled or
# replaced: their group contains the commit hash, so every pushed commit gets its own run (with a
# shared group GitHub would drop all but the newest waiting run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  # Decides which parts a pull request touches. The filter step only runs on pull requests (it
  # reads the changed files through the API, so no checkout is needed). Pushes and pull requests
  # into main run every job: the job conditions below handle that and ignore the filter outputs.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      dispatcher: ${{ steps.filter.outputs.dispatcher }}
      runner: ${{ steps.filter.outputs.runner }}
      engine: ${{ steps.filter.outputs.engine }}
      workflows: ${{ steps.filter.outputs.workflows }}
      licenses: ${{ steps.filter.outputs.licenses }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            # website/ (the code-review.com landing page, #696) is a project of its own: none of the three
            # filters below counts it, so a website-only pull request runs no app, dispatcher or runner job.
            # It runs the website job and the licenses job (the repository-wide checks), and ci-passed
            # still reports.
            app:
              - '**'
              - '!runner/**'
              - '!website/**'
              - '!*.md'
              - '!fakes/**/*.md'
            # The Dispatcher (#327) also reads contracts/ and fakes/, so those count; the app and the
            # runner jobs still run for its changes (the app's project-boundary test lives there).
            dispatcher:
              - '**'
              - '!app/**'
              - '!runner/**'
              - '!website/**'
              - '!*.md'
              - '!fakes/**/*.md'
            runner:
              - '**'
              - '!app/**'
              - '!website/**'
              - '!**/*.md'
            # What the engine suite (runner/tests/engine, 3 jobs of engine.yml) tests: the runner, the
            # fakes and the contracts it runs against, and its own workflow. One brace pattern, because
            # the quantifier "every" would read a list of patterns as "and". A change to anything else
            # (app, dispatcher, docs, the other workflows) does not pay for the engine suite (#713).
            engine:
              - '{runner/**,fakes/**,contracts/**,.github/workflows/engine.yml}'
            workflows:
              - '.github/**'
            # The Markdown exclusions above skip this file, but the license check compares it with
            # license-policy.json (policy-doc.test.ts).
            licenses:
              - 'THIRD_PARTY_LICENSES.md'
            # The landing page (#696): its own job, and the repository-wide checks of the licenses job.
            website:
              - 'website/**'

  # The code-review.com landing page (website/, #696): an Astro site and its own pnpm project, deployed by
  # Cloudflare (Workers Builds, root directory website), not by a workflow. This job only proves that it
  # builds: types, the generated legal Markdown, the build and the build check (`pnpm verify`). It needs
  # nothing but the read-only token and no secret. It is part of ci-passed, so a failing website build
  # blocks the merge; a pull request that does not touch website/ skips it.
  website:
    name: "Website: verify"
    needs: changes
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' || needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      # The full history: the sitemap takes the change date of each page from it (website/astro.config.ts).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # No PUBLIC_POSTHOG_KEY: the build has no banner and no tracking, like a preview build.
      - name: Types, legal texts, build and build check
        run: pnpm verify

  app-fast:
    name: "App: static, unit tests & build"
    needs: changes
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' || needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter code-reviewer-app...
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # The TypeScript types generated from contracts/*.v1.json are committed (app/src/contracts and
      # dispatcher/src/contracts); a stale file fails with the command that regenerates it (#318).
      - name: Check the generated contract types
        run: pnpm contracts:check
      - name: Unit tests
        run: pnpm test
      # The production build is `vercel build --prod` run from the repository root with the project's root directory
      # (.github/workflows/vercel-stage.yml), which runs `next build`: the same pinned CLI builds the App here with a stub
      # project file (the settings of the Vercel project, root directory `app`, Node.js 24) and no token (#724). The app and
      # the Dispatcher are one pnpm workspace, so the function's packages come from node_modules/.pnpm at the root;
      # check-build-output.mjs proves that every file the function lists is in the checkout, which is what the upload
      # sends. Nothing is deployed or pulled, and nothing is read from the network or from a secret.
      - name: Install the Vercel CLI
        uses: ./.github/actions/vercel-cli
      - name: Build the App with the Vercel CLI, as the deployment does
        working-directory: ${{ github.workspace }}
        # Placeholder environment for the production build. Required settings get a dummy value
        # here when they are introduced (for example the database path); real values never belong
        # in CI.
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          VERCEL_TELEMETRY_DISABLED: "1"
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_ci","orgId":"team_ci","settings":{"framework":"nextjs","nodeVersion":"24.x","rootDirectory":"app"}}' > .vercel/project.json
          vercel build --prod --yes
      - name: Check that everything the built functions list is in the checkout
        working-directory: ${{ github.workspace }}
        run: node tools/vercel/check-build-output.mjs app

  # The integration tests in a job of their own, split into two shards: in app-fast they took 6 to
  # 10 minutes and pushed it over its limit (#641). They run against this Postgres service container: every test
  # gets a database of its own, cloned from a migrated template (TEST_DATABASE_URL names the server). The
  # credentials are throwaway: CI uses no repository secret.
  app-int:
    name: "App: integration tests (${{ matrix.shard }}/2)"
    needs: changes
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' || needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter code-reviewer-app...
      - name: Integration tests on the host
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          SHARD: ${{ matrix.shard }}
        run: pnpm test:int --shard="$SHARD/2"

  # The Dispatcher (#327): TypeScript on Hono, its own pnpm project. No database and no network service:
  # its tests run against the fake App of fakes/dispatcher-app on loopback.
  dispatcher-fast:
    name: "Dispatcher: static & tests"
    needs: changes
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' || needs.changes.outputs.dispatcher == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dispatcher
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter code-reviewer-dispatcher...
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Integration tests on the host
        run: pnpm test:int
      # The production deployment builds the Dispatcher with the Vercel CLI, whose Hono builder type-checks through
      # its own language service: it finds packages the way `node` does, not the way `tsc` follows pnpm's symlinks
      # (#412). The same pinned CLI builds it here with a stub project file (the settings of the Vercel project: the
      # Hono preset, Node.js 24) and no token, so a type that only the builder cannot resolve fails before a release.
      # Nothing is deployed or pulled, and nothing is read from the network or from a secret.
      - name: Install the Vercel CLI
        uses: ./.github/actions/vercel-cli
      - name: Build the Dispatcher with the Vercel CLI, as the deployment does
        env:
          VERCEL_TELEMETRY_DISABLED: "1"
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_ci","orgId":"team_ci","settings":{"framework":"hono","nodeVersion":"24.x"}}' > .vercel/project.json
          vercel build --prod --yes
      # `vercel build` succeeding does not mean the function starts (#416): the Hono builder emits the sources file by
      # file, and an import it leaves pointing at a file that is not in the function fails when Node loads it, on the
      # first request of the deployment. This starts the built function the way the platform's launcher does, with
      # placeholder settings, and asks it for GET /health. Offline, no token, no secret.
      - name: Start the built function and ask it for GET /health
        run: node scripts/check-built-function.mjs
      # The deployment builds from the repository root with the project's root directory, in a workspace whose packages are
      # in node_modules/.pnpm at the root (#724): the same CLI builds the Dispatcher that way, and every file its function
      # lists must be in the checkout. (The function of that layout is not started here: it is not self-contained
      # until the upload resolves its file map; the step above starts the one of this directory.)
      - name: Build the Dispatcher from the repository root, as the deployment does, and check the upload
        working-directory: ${{ github.workspace }}
        env:
          VERCEL_TELEMETRY_DISABLED: "1"
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_ci","orgId":"team_ci","settings":{"framework":"hono","nodeVersion":"24.x","rootDirectory":"dispatcher"}}' > .vercel/project.json
          vercel build --prod --yes
          node tools/vercel/check-build-output.mjs dispatcher

  # The privileged lane of the Sandbox-Launcher (#329-T09, T10): `make test-sandbox-local` builds the `sandbox`
  # target on the runner's Docker daemon and runs the Launcher's local mode against it and the fake App, so
  # `docker run <image id>` with the full rendered flag set (IPv6 sysctls, memory and swap, capabilities, tmpfs) is
  # proven on a real daemon, and nothing of one job is left for the next. The container reaches the fake App on the
  # docker0 gateway. No login, no push, the read-only token.
  sandbox-local:
    name: "Dispatcher: Sandbox-Launcher with a real Docker daemon"
    needs: changes
    if: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' || needs.changes.outputs.dispatcher == 'true' || needs.changes.outputs.runner == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install the dispatcher dependencies
        run: pnpm install --frozen-lockfile --filter code-reviewer-dispatcher...
      - name: Run the Sandbox-Launcher against a real Docker daemon
        run: make test-sandbox-local

  runner-fast:
    name: "Runner: static & tests"
    needs: changes
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' || needs.changes.outputs.runner == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v7
      # The Python version comes from runner/.python-version, which uv reads from the working
      # directory.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: runner/uv.lock
      # The Worker tests (#323) start the fake App of fakes/dispatcher-app, a Node script.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . ../fakes
      - name: Check formatting
        run: uv run ruff format --check . ../fakes
      - name: Typecheck
        run: uv run pyright
      - name: Unit tests
        run: uv run pytest -m unit
      - name: Integration and contract tests on the host
        run: uv run pytest -m "integration or contract"

  # The engine suite: the real, pinned PR-Agent against a fake GitHub and a fake LLM
  # (runner/tests/engine), defined once in engine.yml. No Docker stack: the fakes are loopback
  # servers the tests start themselves. Runs for pull requests that change the runner, the fakes or the
  # contracts and for pull requests into main; nightly.yml runs the same suite on development. This job is the rollup of the
  # jobs engine.yml runs (the two engine shards and the privileged suite): ci-passed needs this one
  # name, and it fails when any of them fails. A skipped job never blocks a merge, a failed one does
  # (ci-passed).
  engine:
    name: "Runner: engine tests"
    needs: changes
    if: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' || needs.changes.outputs.engine == 'true') }}
    permissions:
      contents: read
    uses: ./.github/workflows/engine.yml

  # The journey with the real runner and the real PR-Agent (app/e2e/jobs) is part of these, so a
  # change to the runner runs them too.
  e2e:
    name: "E2E: browser journeys"
    needs: changes
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' || needs.changes.outputs.app == 'true' || needs.changes.outputs.runner == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Every app under test makes a database of its own on this server (E2E_DATABASE_URL). The credentials are
    # throwaway: CI uses no repository secret.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter code-reviewer-app...
      # The headless Chromium needs no apt packages: the runner image has its libraries. --with-deps
      # only added fonts and xvfb from the Ubuntu mirror, which took up to 9 minutes (#641).
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Restore the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser
        timeout-minutes: 5
        run: pnpm exec playwright install chromium
      # The journey app/e2e/jobs starts the real runner (a process per journey) and the real
      # PR-Agent: the runner from its locked environment, and the tiktoken encoding PR-Agent counts
      # tokens with from the cache (the one step that needs the internet, as in engine.yml).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: runner/uv.lock
      - name: Install the runner
        working-directory: runner
        run: uv sync --locked
      - name: Restore the tiktoken encoding
        uses: actions/cache@v4
        with:
          path: /tmp/data-gym-cache
          key: tiktoken-o200k_base-v1
      - name: Prime the tiktoken cache
        working-directory: runner
        run: uv run python scripts/prime_tiktoken_cache.py
      # Playwright builds the app and serves the production build itself (playwright.config.ts).
      # Pull requests into development run the smoke journeys, everything else
      # (release pull requests into main, pushes) runs all journeys. Journeys tagged @flaky are
      # quarantined and only run in the nightly workflow.
      - name: Run the smoke journeys
        if: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: pnpm test:e2e --grep @smoke --grep-invert @flaky
      - name: Run all journeys
        if: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: pnpm test:e2e --grep-invert @flaky
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14
          if-no-files-found: ignore

  # The hosted lane (#332): the whole hosted flow with the real code of the App (serverless mode, over the Postgres
  # service container below), the Dispatcher (a process, started by the journeys) and the Worker (`worker-once` and
  # `probe`, started by the Dispatcher's Sandbox-Launcher through the `docker` stand-in of fakes/sandbox/bin), over the
  # loopback fakes: GitHub, the model and the Sandbox platform's local mode. No Docker daemon, no secret, no network
  # beyond loopback (the tiktoken encoding of PR-Agent is the one download, as in the e2e job). The same journeys with
  # the Dynamic Worker under the container's capabilities and read-only root are in the privileged lane (e2e-dynamic).
  e2e-hosted:
    name: "E2E: hosted deployment on fakes"
    needs: changes
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' || needs.changes.outputs.app == 'true' || needs.changes.outputs.runner == 'true' || needs.changes.outputs.dispatcher == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    # The lane makes its own database on this server (E2E_DATABASE_URL). The credentials are throwaway: CI uses no
    # repository secret.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The journeys start the Dispatcher's test host (dispatcher/src/test-support), so both projects are installed.
      - name: Install the dependencies of the app and the Dispatcher
        run: pnpm install --frozen-lockfile --filter code-reviewer-app... --filter code-reviewer-dispatcher...
      # The headless Chromium needs no apt packages: the runner image has its libraries. --with-deps
      # only added fonts and xvfb from the Ubuntu mirror, which took up to 9 minutes (#641).
      - name: Read the Playwright version
        id: playwright
        working-directory: app
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Restore the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser
        working-directory: app
        timeout-minutes: 5
        run: pnpm exec playwright install chromium
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: runner/uv.lock
      - name: Install the runner
        working-directory: runner
        run: uv sync --locked
      - name: Restore the tiktoken encoding
        uses: actions/cache@v4
        with:
          path: /tmp/data-gym-cache
          key: tiktoken-o200k_base-v1
      - name: Prime the tiktoken cache
        working-directory: runner
        run: uv run python scripts/prime_tiktoken_cache.py
      # Playwright builds the app and serves the production build itself (playwright.hosted.config.ts), after the
      # migrations of `pnpm migrate`, like a deployment does. Every journey runs, on every pull request.
      - name: Run the hosted journeys
        working-directory: app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: pnpm test:e2e:hosted
      - name: Upload the Playwright report and the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-hosted-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14
          if-no-files-found: ignore

  # The privileged Dynamic lane (#253, #201-T01): the journey of a pull request through the real app,
  # the real Worker (root, the capabilities of the hardened container spec, its own startup self-check)
  # and the real pinned OpenCode as the engine user, against the loopback fakes only. It needs root, so
  # it has a job of its own: the GitHub runner has passwordless sudo and the nf_tables module.
  # runner/scripts/run_dynamic_e2e.sh fetches the pinned OpenCode and ripgrep (the pin files accept
  # only the pinned bytes), makes the one production build and runs the journeys in a network
  # namespace of their own; nothing is skipped, and what is missing is named by the preflight.
  # The job runs the code of the pull request as root. Its safety is the GitHub-hosted, ephemeral VM,
  # the read-only token, the absence of any secret and the `pull_request` trigger: it must never move
  # to a self-hosted runner, to `pull_request_target` or to a job with secrets or write permissions
  # (pinned by app/src/ci/dynamic-lane.test.ts, #253-C06), and its checkout keeps no credentials.
  e2e-dynamic:
    name: "E2E: Dynamic Review with the real OpenCode (privileged)"
    needs: changes
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' || needs.changes.outputs.app == 'true' || needs.changes.outputs.runner == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The hosted journey of the lane (#332) starts the Dispatcher's test host, so both projects are installed.
      - name: Install the dependencies of the app and the Dispatcher
        run: pnpm install --frozen-lockfile --filter code-reviewer-app... --filter code-reviewer-dispatcher...
      # The headless Chromium needs no apt packages: the runner image has its libraries. --with-deps
      # only added fonts and xvfb from the Ubuntu mirror, which took up to 9 minutes (#641).
      - name: Read the Playwright version
        id: playwright
        working-directory: app
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Restore the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser
        working-directory: app
        timeout-minutes: 5
        run: pnpm exec playwright install chromium
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: runner/uv.lock
      - name: Install the runner
        working-directory: runner
        run: uv sync --locked
      # nft installs the engine user's network rules and the lane's network guard. ripgrep is not installed
      # here: the lane uses the pinned one (the runner's self-check compares it with runner/ripgrep-pin.json).
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends nftables
      # The pinned OpenCode (runner/opencode-pin.json); the cache just saves the download.
      - name: Restore the pinned OpenCode
        uses: actions/cache@v4
        with:
          path: ~/.cache/code-reviewer/opencode
          key: opencode-${{ hashFiles('runner/opencode-pin.json') }}
      # The lane has no network but loopback; it reaches the Postgres server of the job through a Unix socket
      # (app/e2e/pg-bridge.ts, started by the script).
      - name: Run the Dynamic Review journey and the network guard
        working-directory: runner
        env:
          E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: scripts/run_dynamic_e2e.sh
      - name: Upload the Playwright report and the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-dynamic-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14
          if-no-files-found: ignore

  # The dependency license check (license-policy.json, app/src/ci/license-check): fails when a
  # package of pnpm-lock.yaml or uv.lock has a license outside the allow list. It reads the license
  # metadata that pnpm and uv installed, so it needs both parts installed from the lockfiles and no
  # network service. Runs for every code change, because the policy, the lockfiles and the check
  # itself live in both parts, for a change to THIRD_PARTY_LICENSES.md and for a change to website/.
  # Besides the check it runs the tests that keep that file and the policy together, the SPDX header
  # check and the scans of the whole tree (tracked secrets, repository identity, billing, legacy
  # variables), which are app tests that a runner-only or website-only pull request would otherwise
  # skip.
  licenses:
    name: "Licenses: dependency check"
    needs: changes
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' || needs.changes.outputs.app == 'true' || needs.changes.outputs.dispatcher == 'true' || needs.changes.outputs.runner == 'true' || needs.changes.outputs.licenses == 'true' || needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install the app and dispatcher dependencies
        run: pnpm install --frozen-lockfile --filter code-reviewer-app... --filter code-reviewer-dispatcher...
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: runner/uv.lock
      - name: Install the runner dependencies
        working-directory: runner
        run: uv sync --locked
      - name: Check the licenses of all dependencies
        run: pnpm licenses:check
      # The tests that hold THIRD_PARTY_LICENSES.md and the policy together, and the SPDX header of
      # every source file (also those of a pull request that only touches the runner, for which
      # app-fast is skipped).
      - name: Check that the license documentation agrees with the policy
        run: pnpm exec vitest run --project unit src/ci/license-check
      - name: Check the SPDX headers
        run: pnpm spdx:check
      # The scans of the whole tree, which app-fast runs with the rest of the unit tests. A pull request that
      # only touches website/ (or only the runner) skips app-fast, and these must not be skipped with it.
      - name: Scan the whole tree (secrets, repository identity, billing, legacy variables)
        run: pnpm exec vitest run --project unit src/ci/tracked-secrets src/ci/repository-identity src/ci/billing-cleanup src/ci/legacy-variables

  # The Worker image (#324): the `sandbox` target of runner/Dockerfile, the only image of the project. The golden
  # snapshot of the hosted deployment builds the same file inside a Vercel Sandbox VM. A pull request builds it here,
  # starts it and checks what a unit test cannot (docker/smoke/runner.sh): the pins, the user layout, the entry modes
  # with the production flags (probe, worker-once against the fake App, the engines file), the secret scan and that it
  # carries no Dispatcher bundle. Nothing is pushed anywhere: the source is visible but not licensed (LICENSE), so no
  # image is published, and the job has no login and only the read-only token of the workflow.
  image-runner-sandbox:
    name: "Image: Worker build & smoke test"
    needs: changes
    if: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' || needs.changes.outputs.runner == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # The smoke test runs the fake App (Node) and the engine suite's fakes (Python, standard library)
      # on the host.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: runner/Dockerfile
          target: sandbox
          load: true
          push: false
          tags: code-reviewer-runner-sandbox:ci
          cache-from: type=gha,scope=runner-sandbox
          cache-to: type=gha,mode=max,scope=runner-sandbox
      - name: Smoke test the image
        run: docker/smoke/runner.sh code-reviewer-runner-sandbox:ci

  actionlint:
    name: Lint workflow files
    needs: changes
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Uses .github/actionlint.yaml. The image bundles shellcheck for the run steps.
      - name: Run actionlint
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  # The only check that branch protection requires. It runs even when jobs fail or are skipped,
  # fails on any failed or cancelled job and accepts skipped jobs (path filter).
  ci-passed:
    name: All checks passed?
    needs: [changes, website, app-fast, app-int, dispatcher-fast, runner-fast, engine, e2e, e2e-hosted, e2e-dynamic, licenses, image-runner-sandbox, sandbox-local, actionlint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Show the result of every job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"
      - name: Fail if a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
