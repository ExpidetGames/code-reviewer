name: Golden snapshot

# Builds the golden snapshot of the hosted deployment (#316, #330): a builder VM on Vercel Sandbox installs a
# pinned Docker, builds the Worker image from this commit, stops the daemon cleanly and snapshots; a second VM
# created from that snapshot then scans it for secrets and job data, checks the image id and runs the image's own
# self-check. Only a snapshot that passed all of it gets a record (the artifact `golden-snapshot-record`). The
# Dispatcher is configured with that record by hand (docs/golden-snapshot.md); nothing here changes a deployment.
#
# It never runs for a pull request or a fork, and it never runs job code: the builder VM runs our own build and the
# Worker image's `probe` mode, nothing from a pull request. The Vercel token is read by the build step only, from the
# environment `hosted-snapshot`, and is never in a command line or a log. A push to main runs it only when the
# repository variable GOLDEN_SNAPSHOT_ENABLED is "true" (set it once the secrets exist); a manual run needs no variable.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target of runner/Dockerfile"
        default: sandbox
        required: false
      pinned_snapshot:
        description: "Snapshot id the Dispatcher is configured with now (retention never deletes it)"
        required: false
  push:
    branches: [main]

permissions:
  contents: read

# Runs queue one behind the other: cancelling a run could leave a builder VM and a half made snapshot behind.
concurrency:
  group: golden-snapshot
  cancel-in-progress: false

jobs:
  build:
    name: Build, check and record the golden snapshot
    if: ${{ github.repository == 'ExpidetGames/code-reviewer' && (github.event_name == 'workflow_dispatch' || vars.GOLDEN_SNAPSHOT_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Holds VERCEL_TOKEN, VERCEL_TEAM_ID and VERCEL_PROJECT_ID; protect it with a required reviewer if wanted.
    environment: hosted-snapshot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: dispatcher/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: dispatcher/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: dispatcher
        run: pnpm install --frozen-lockfile
      # Tracked files of this commit only: the build context cannot hold an untracked file or a credential.
      - name: Archive the commit
        run: git archive --format=tar.gz --output "$RUNNER_TEMP/context.tgz" HEAD
      - name: Build, check and record the snapshot
        working-directory: dispatcher
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET: ${{ inputs.target || 'sandbox' }}
          PINNED: ${{ inputs.pinned_snapshot }}
        run: |
          args=(
            --context "$RUNNER_TEMP/context.tgz"
            --vm-prepare ../docker/sandbox/vm-prepare.sh
            --out "$RUNNER_TEMP/golden-snapshot.json"
            --commit "$GITHUB_SHA"
            --target "$TARGET"
          )
          if [ -n "$PINNED" ]; then args+=(--pin-snapshot "$PINNED"); fi
          pnpm snapshot:build "${args[@]}"
      - name: Show the record
        run: |
          {
            echo "### Golden snapshot"
            echo
            echo "Set these in the Dispatcher project (docs/golden-snapshot.md), after the canary passed on the new snapshot:"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/golden-snapshot.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the record
        uses: actions/upload-artifact@v7
        with:
          name: golden-snapshot-record
          path: ${{ runner.temp }}/golden-snapshot.json
          retention-days: 90
          if-no-files-found: error
