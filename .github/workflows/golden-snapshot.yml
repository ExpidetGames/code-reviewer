name: Golden snapshot

# Builds the golden snapshot of the hosted deployment (#316, #330, #403): a builder VM on Vercel Sandbox installs a
# pinned Docker, builds the Worker image from this commit, stops the daemon cleanly and snapshots; a second VM
# created from that snapshot then scans it for secrets and job data, checks the image id and runs the image's own
# self-check. Only a snapshot that passed all of it gets a record (the artifact `golden-snapshot-record`) and the
# outputs below.
#
# deploy-production.yml calls it when the Worker image inputs changed since the commit of the snapshot in use (or
# there is none): the new snapshot is then proven by the canary on the staged Dispatcher and made current only after
# the promotion. This workflow never wires a snapshot into a deployment, never writes to Infisical and never removes
# a snapshot of an earlier run (`--skip-retention`): the deployment does all of that, in that order, so that the
# snapshot production runs is never at risk. Started by hand it is a rehearsal: it builds and checks a snapshot and
# leaves it; the next deployment that cleans up removes it. To roll a new snapshot out without a change of the
# image inputs (the platform's base image changed, say) run Deploy production with `rebuild_snapshot`.
#
# It never runs for a pull request or a fork, and it never runs job code: the builder VM runs our own build and the
# Worker image's `probe` mode, nothing from a pull request. The Vercel token, the team and the Dispatcher's project
# id are loaded from Infisical /ci just before the build step, after the dependencies were installed, with the
# sign-in secrets of the environment `production` (restricted to main), and are never in a command line or a log.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target of runner/Dockerfile; empty is the default of dispatcher/src/snapshot/config.ts (sandbox)"
        default: ""
        required: false
  workflow_call:
    inputs:
      target:
        description: "Build target of runner/Dockerfile; empty is the default of dispatcher/src/snapshot/config.ts (sandbox)"
        default: ""
        required: false
        type: string
    secrets:
      INFISICAL_CLIENT_ID:
        description: Client id of the Infisical machine identity (a secret of the environment production, passed by the caller)
        required: true
      INFISICAL_CLIENT_SECRET:
        description: Client secret of the Infisical machine identity (a secret of the environment production, passed by the caller)
        required: true
      INFISICAL_DOMAIN:
        description: Address of the Infisical instance (a secret of the environment production, passed by the caller)
        required: true
      INFISICAL_PROJECT_SLUG:
        description: Slug of the Infisical project (a secret of the environment production, passed by the caller)
        required: true
    outputs:
      snapshot-id:
        description: The snapshot the Sandbox-Launcher creates job VMs from
        value: ${{ jobs.build.outputs.snapshot-id }}
      image-digest:
        description: The id of the Worker image inside it
        value: ${{ jobs.build.outputs.image-digest }}
      commit:
        description: The commit it was built from
        value: ${{ jobs.build.outputs.commit }}

permissions:
  contents: read

# Runs queue one behind the other: cancelling a run could leave a builder VM and a half made snapshot behind.
# A rehearsal by hand and the build a deployment calls have groups of their own: a pending rehearsal must not replace
# the pending build of a deployment (GitHub keeps one pending run per group). `github.workflow` is the name of the
# top-level workflow, so inside a call it is the caller's.
concurrency:
  group: ${{ github.workflow == 'Golden snapshot' && 'golden-snapshot-rehearsal' || 'golden-snapshot-deploy' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, check and record the golden snapshot
    # The job's own condition guards against an accident; the boundary is the environment `production`, whose
    # deployment branches are restricted to main (docs/deployment-vercel.md, section 2.1).
    if: ${{ github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
    outputs:
      snapshot-id: ${{ steps.record.outputs.snapshot-id }}
      image-digest: ${{ steps.record.outputs.image-digest }}
      commit: ${{ steps.record.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: dispatcher/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        working-directory: dispatcher
        run: pnpm install --frozen-lockfile
      # Tracked files of this commit only: the build context cannot hold an untracked file or a credential.
      - name: Archive the commit
        run: git archive --format=tar.gz --output "$RUNNER_TEMP/context.tgz" HEAD
      # The snapshot has to be in the Dispatcher's project, because the Launcher creates job VMs in the project it
      # runs in. VERCEL_TOKEN and VERCEL_TEAM_ID are exported under the names the build reads.
      - name: Load the Vercel credentials from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: VERCEL_TOKEN VERCEL_TEAM_ID VERCEL_DISPATCHER_PROJECT_ID
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: No snapshot was built.
      - name: Build, check and record the snapshot
        working-directory: dispatcher
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_DISPATCHER_PROJECT_ID }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          args=(
            --context "$RUNNER_TEMP/context.tgz"
            --vm-prepare ../docker/sandbox/vm-prepare.sh
            --out "$RUNNER_TEMP/golden-snapshot.json"
            --commit "$GITHUB_SHA"
            --skip-retention
          )
          # The default target is the one in dispatcher/src/snapshot/config.ts, an input of the snapshot: it is not
          # repeated here, where a change would go unseen.
          if [ -n "$TARGET" ]; then
            args+=(--target "$TARGET")
          fi
          pnpm snapshot:build "${args[@]}"
      - name: Read the record
        id: record
        run: |
          set -euo pipefail
          {
            echo "snapshot-id=$(jq -r .snapshotId "$RUNNER_TEMP/golden-snapshot.json")"
            echo "image-digest=$(jq -r .imageDigest "$RUNNER_TEMP/golden-snapshot.json")"
            echo "commit=$(jq -r .commit "$RUNNER_TEMP/golden-snapshot.json")"
          } >> "$GITHUB_OUTPUT"
      - name: Show the record
        run: |
          {
            echo "### Golden snapshot"
            echo
            echo "Not wired into anything yet. A deployment makes it current after its canary passed and the promotion went through (docs/deployment-vercel.md, section 5.1)."
            echo
            echo '```json'
            cat "$RUNNER_TEMP/golden-snapshot.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: golden-snapshot-record
          path: ${{ runner.temp }}/golden-snapshot.json
          retention-days: 90
          if-no-files-found: error
