name: Vercel stage

# Reusable (#403): stages one project of the hosted deployment on Vercel production with the Vercel CLI, for
# deploy-production.yml. It builds the commit here (`vercel pull`, `vercel build --prod`) and uploads the result
# (`vercel deploy --prebuilt --prod --skip-domain`): a staged production deployment, which uses the production
# variables and is not assigned the production domains. Nothing goes live here; promoting is a job of
# deploy-production.yml, after the canary. The project's Git integration is switched off (vercel.json), so the CLI
# is the only way a deployment is made.
#
# The runtime variables of the project come from Vercel (`vercel pull`; Infisical's Secret Sync keeps them there,
# docs/deployment-vercel.md, section 3). The credentials the CLI needs - the token, the team id and the project id
# of this project - come from Infisical /ci, loaded by .github/actions/infisical-ci-secrets with the sign-in secrets
# of the environment `production`. The order matters: the dependencies are installed FIRST, so that their install
# scripts never see the token; the token is loaded then, for `vercel pull` and `vercel deploy`; and `vercel build`,
# which runs the project's code (`next build`, bundlers, plugins), runs without the token (`env -u`), because it works from
# the files `vercel pull` wrote and needs no platform call (checked against the CLI's source and a run without a
# token). The CLI reads the credentials from the environment: the token is never on a command line.
#
# For the Dispatcher the deployment carries the golden snapshot pair this run uses (`snapshot-id`, `image-digest`,
# `snapshot-commit`): as run-time variables of this one deployment (`--env`) and as its meta. The project's own
# variables are not touched, so the live deployment keeps the pair it has until the promotion; the canary compares
# the image id the staged deployment reports with the one passed here, so a pair that did not reach the deployment
# stops the pipeline instead of passing on the old image. The job runs only for this repository on main.
on:
  workflow_call:
    inputs:
      project:
        description: Short name of the Vercel project, used in the job name and the GitHub deployment (app, dispatcher)
        required: true
        type: string
      directory:
        description: Root directory of the project in the repository (app, dispatcher)
        required: true
        type: string
      project-id-secret:
        description: Name of the secret at Infisical /ci that holds the project's id
        required: true
        type: string
      ref:
        description: Commit SHA to check out and build
        required: true
        type: string
      snapshot-id:
        description: Golden snapshot this deployment uses (the Dispatcher only; empty for the App)
        required: false
        default: ""
        type: string
      image-digest:
        description: Worker image id in that snapshot
        required: false
        default: ""
        type: string
      snapshot-commit:
        description: Commit the snapshot was built from
        required: false
        default: ""
        type: string
    secrets:
      INFISICAL_CLIENT_ID:
        description: Client id of the Infisical machine identity (a secret of the environment production, passed by the caller)
        required: true
      INFISICAL_CLIENT_SECRET:
        description: Client secret of the Infisical machine identity (a secret of the environment production, passed by the caller)
        required: true
      INFISICAL_DOMAIN:
        description: Address of the Infisical instance (a secret of the environment production, passed by the caller)
        required: true
      INFISICAL_PROJECT_SLUG:
        description: Slug of the Infisical project (a secret of the environment production, passed by the caller)
        required: true
    outputs:
      url:
        description: Address of the staged deployment (https, a Vercel deployment host)
        value: ${{ jobs.stage.outputs.url }}
      deployment-id:
        description: Id of the GitHub deployment record of this stage
        value: ${{ jobs.stage.outputs.deployment-id }}

permissions:
  contents: read

env:
  VERCEL_TELEMETRY_DISABLED: "1"

jobs:
  stage:
    name: Stage ${{ inputs.project }} on Vercel
    if: ${{ github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Holds the Infisical sign-in; its deployment branches are restricted to main.
    environment: production
    permissions:
      contents: read
      deployments: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      deployment-id: ${{ steps.record.outputs.deployment-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Record the deployment on GitHub
        id: record
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PROJECT: ${{ inputs.project }}
          COMMIT_SHA: ${{ inputs.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const environment = `${process.env.PROJECT}-production`;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.COMMIT_SHA,
              environment,
              description: `Vercel production deployment of ${process.env.PROJECT}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              environment,
              log_url: process.env.RUN_URL,
              description: 'Staged on Vercel, not promoted yet.',
              auto_inactive: false,
            });
            core.setOutput('deployment-id', String(deployment.data.id));
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ inputs.directory }}/package.json
      # No cache: what is promoted is built from the lockfile, not from a cache another run wrote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      # Before the token is loaded: the install scripts of the dependencies run without it. The install command of
      # the project, which `vercel build` runs later, finds nothing to do.
      - name: Install the dependencies
        env:
          DIRECTORY: ${{ inputs.directory }}
        run: pnpm --dir "$DIRECTORY" install --frozen-lockfile
      - name: Install the Vercel CLI
        uses: ./.github/actions/vercel-cli
      - name: Load the Vercel credentials from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: VERCEL_TOKEN VERCEL_TEAM_ID ${{ inputs.project-id-secret }}
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: Nothing is deployed.
      # The CLI reads the team and the project from VERCEL_ORG_ID and VERCEL_PROJECT_ID. The loaded values are
      # already masked; they are neither echoed nor passed on a command line.
      - name: Export the team and project ids under the names the CLI reads
        env:
          PROJECT_ID_SECRET: ${{ inputs.project-id-secret }}
        run: |
          set -euo pipefail
          echo "VERCEL_ORG_ID=${VERCEL_TEAM_ID}" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=${!PROJECT_ID_SECRET}" >> "$GITHUB_ENV"
      # The pair of this run must be there to be used: a re-run of failed jobs of a run whose snapshot was removed
      # stops here with a code that says so.
      - name: Check that the golden snapshot still exists
        if: ${{ inputs.snapshot-id != '' }}
        env:
          PAIR_SNAPSHOT_ID: ${{ inputs.snapshot-id }}
        run: pnpm --dir dispatcher snapshot:ops exists
      - name: Pull the production settings and variables
        run: vercel pull --yes --environment=production
      # The code of the project runs here (next build, bundlers, plugins). The token is removed from its environment
      # by `env -u`, which does not depend on which of a step's and the job's variables wins.
      - name: Build
        run: env -u VERCEL_TOKEN vercel build --prod
      # `--skip-domain`: the staged deployment of docs/deployment-vercel.md, section 5.1. `--json` prints the
      # deployment as one JSON document on stdout (the CLI's other output goes to stderr).
      - name: Deploy the build, staged
        id: deploy
        env:
          COMMIT_SHA: ${{ inputs.ref }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SNAPSHOT_ID: ${{ inputs.snapshot-id }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          SNAPSHOT_COMMIT: ${{ inputs.snapshot-commit }}
        run: |
          set -euo pipefail

          # The pair is all three values or none, each of its own shape.
          pair=()
          if [ -n "${SNAPSHOT_ID}${IMAGE_DIGEST}${SNAPSHOT_COMMIT}" ]; then
            if ! [[ "${SNAPSHOT_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{2,127}$ ]] \
              || ! [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || ! [[ "${SNAPSHOT_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The golden snapshot pair of this deployment is incomplete or malformed."
              exit 1
            fi
            pair=(
              --env "SANDBOX_SNAPSHOT_ID=${SNAPSHOT_ID}"
              --env "SANDBOX_IMAGE_DIGEST=${IMAGE_DIGEST}"
              --meta "sandboxSnapshotId=${SNAPSHOT_ID}"
              --meta "sandboxImageDigest=${IMAGE_DIGEST}"
              --meta "sandboxSnapshotCommit=${SNAPSHOT_COMMIT}"
            )
          fi

          status=0
          document="$(
            vercel deploy --prebuilt --prod --skip-domain --archive=tgz --json \
              --meta githubDeployment=1 \
              --meta githubCommitRef=main \
              --meta githubCommitSha="${COMMIT_SHA}" \
              --meta githubCommitOrg="${REPOSITORY_OWNER}" \
              --meta githubCommitRepo="${REPOSITORY#*/}" \
              --meta githubOrg="${REPOSITORY_OWNER}" \
              --meta githubRepo="${REPOSITORY#*/}" \
              ${pair[@]+"${pair[@]}"}
          )" || status=$?
          # On a failure the CLI prints a document with a stable reason on stdout; the rest of its output is on stderr.
          if [ "${status}" -ne 0 ]; then
            reason="$(jq -r '.reason // empty | select(test("^[a-z_]{1,40}$"))' <<< "${document}" 2> /dev/null || true)"
            echo "::error::The deployment failed${reason:+ (${reason})}."
            exit 1
          fi
          url="$(jq -r '.url // empty' <<< "${document}")"
          id="$(jq -r '.id // empty' <<< "${document}")"
          target="$(jq -r '.target // empty' <<< "${document}")"
          state="$(jq -r '.readyState // empty' <<< "${document}")"
          if ! [[ "${url}" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]] || ! [[ "${id}" =~ ^dpl_[A-Za-z0-9]+$ ]]; then
            echo "::error::The CLI did not report a deployment."
            exit 1
          fi
          # A preview, or a deployment that is not ready, is no staged production deployment.
          if [ "${target}" != "production" ] || [ "${state}" != "READY" ]; then
            echo "::error::The CLI did not report a ready production deployment."
            exit 1
          fi
          {
            echo "url=${url}"
            echo "vercel-id=${id}"
          } >> "$GITHUB_OUTPUT"
      - name: Summarize
        env:
          PROJECT: ${{ inputs.project }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Staged ${PROJECT}"
            echo
            echo "- url: ${DEPLOYMENT_URL}"
            echo "- not promoted yet: the production domains still point at the previous deployment"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Mark the GitHub deployment failed
        if: ${{ failure() && steps.record.outputs.deployment-id != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DEPLOYMENT_ID: ${{ steps.record.outputs.deployment-id }}
          PROJECT: ${{ inputs.project }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: 'failure',
              environment: `${process.env.PROJECT}-production`,
              log_url: process.env.RUN_URL,
              description: 'The deployment could not be staged.',
              auto_inactive: false,
            });
