name: Website

# The code-review.com landing page (website/, #696): an Astro site and its own pnpm project, deployed by Cloudflare
# (Workers Builds, root directory website), not by a workflow. This workflow only proves that it builds: types, the
# generated legal Markdown, the build and the build check (`pnpm verify`). It runs for changes under website/ and to
# this file, and it needs nothing but the read-only token and no secret. The heavy jobs of ci.yml skip such pull
# requests (the path filter of its `changes` job), so website changes never wait for the app, runner and browser jobs.

on:
  pull_request:
    branches: [development, main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  push:
    branches: [development, main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read

# A new push to a pull request cancels the superseded run; every pushed commit keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  verify:
    name: "Website: verify"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # No PUBLIC_POSTHOG_KEY: the build has no banner and no tracking, like a preview build.
      - name: Types, legal texts, build and build check
        run: pnpm verify
