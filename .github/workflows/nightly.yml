name: Nightly

# The suites that are too slow or too heavy for every pull request, on the default branch (the
# schedule always runs there). Today that is the engine suite: the real, pinned PR-Agent through
# the job entry point against a fake GitHub and a fake LLM. The same job runs in ci.yml for pull
# requests that change the runner and for pull requests into main. No repository secrets: the
# fakes need none, and the suite must never talk to a real model or a real GitHub.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  engine:
    name: "Runner: engine tests (real PR-Agent, fake GitHub and LLM)"
    # A fork has no use for a nightly run of its own.
    if: ${{ github.repository == 'ExpidetGames/code-reviewer' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: runner/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      # The one step that needs the internet: PR-Agent counts tokens with a tiktoken encoding that
      # it would download on first use. The tests run without any outside connection.
      - name: Cache the tiktoken encoding
        run: uv run python scripts/prime_tiktoken_cache.py
      - name: Engine tests
        run: uv run pytest -m engine
