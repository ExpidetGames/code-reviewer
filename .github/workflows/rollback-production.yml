name: Rollback production

# Puts a previous deployment of the hosted version back into production (#403): the App, the Dispatcher or both, each
# with the deployment id (dpl_...) or the deployment address (https://....vercel.app) to restore, from the Vercel
# dashboard or from the summary of an earlier run of deploy-production. It first checks, with the Vercel API, that
# each deployment is a ready production deployment of the right project and team, then runs `vercel rollback` with the
# pinned CLI. A rollback does not undo a migration (docs/deployment-vercel.md, section 7): it is safe while the
# migrations since were additive. After a rollback Vercel stops assigning the production domains to new deployments
# of that project; the `vercel promote` of the next deploy-production run assigns them again.
#
# For the Dispatcher it also writes the golden snapshot pair of the restored deployment (read from its meta) back to
# Infisical /dispatcher, with the write path the persist job uses, so that the next deployment does not decide from a
# pair that production no longer runs. The restored deployment's snapshot still exists as long as it is the current or
# the previous one (the cleanup of deploy-production keeps both); an older one may be gone.
#
# Manual only, and only for this repository on main (the job's own condition guards against accidents; the boundary is
# the environment `production`, restricted to main). It has a queue of its own: an emergency rollback must not wait
# behind a deployment, and a waiting deployment must not drop a waiting rollback. It needs no approval: whoever can run
# a workflow on main can roll back (docs/deployment-vercel.md, section 7).
on:
  workflow_dispatch:
    inputs:
      app_deployment:
        description: "App: deployment id (dpl_...) or address (https://....vercel.app) to restore; empty leaves the App alone"
        required: false
        default: ""
      dispatcher_deployment:
        description: "Dispatcher: deployment id (dpl_...) or address (https://....vercel.app) to restore; empty leaves the Dispatcher alone"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: rollback-production
  cancel-in-progress: false

env:
  VERCEL_TELEMETRY_DISABLED: "1"

jobs:
  rollback:
    name: Roll production back
    if: ${{ github.repository == 'ExpidetGames/code-reviewer' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the inputs
        env:
          APP_DEPLOYMENT: ${{ inputs.app_deployment }}
          DISPATCHER_DEPLOYMENT: ${{ inputs.dispatcher_deployment }}
        run: |
          set -euo pipefail

          if [ -z "${APP_DEPLOYMENT}" ] && [ -z "${DISPATCHER_DEPLOYMENT}" ]; then
            echo "::error::Give at least one deployment to restore."
            exit 1
          fi
          for value in "${APP_DEPLOYMENT}" "${DISPATCHER_DEPLOYMENT}"; do
            [ -z "${value}" ] && continue
            if ! [[ "${value}" =~ ^dpl_[A-Za-z0-9]{8,64}$ ]] && ! [[ "${value}" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
              echo "::error::A deployment is a Vercel deployment id (dpl_...) or a deployment address (https://....vercel.app)."
              exit 1
            fi
          done
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: dispatcher/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      # Before the token is loaded.
      - name: Install dependencies
        run: pnpm --dir dispatcher install --frozen-lockfile
      - name: Install the Vercel CLI
        uses: ./.github/actions/vercel-cli
      - name: Load the Vercel credentials from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: VERCEL_TOKEN VERCEL_TEAM_ID VERCEL_APP_PROJECT_ID VERCEL_DISPATCHER_PROJECT_ID
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: Nothing was rolled back.
      # Both are checked before either is rolled back: a mistake in the second must not leave the first moved.
      - name: Check that the App deployment is a production deployment of the App
        if: ${{ inputs.app_deployment != '' }}
        env:
          DEPLOYMENT: ${{ inputs.app_deployment }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_APP_PROJECT_ID }}
        run: pnpm --dir dispatcher snapshot:ops verify --deployment "$DEPLOYMENT"
      # The Dispatcher's snapshot has to exist too: the cleanup keeps the new and the previous one only, and a Dispatcher
      # put back onto a snapshot that is gone fails every job. Refused with `rollback_snapshot_missing`, before either
      # project is touched; production stays as it is.
      - name: Check that the Dispatcher deployment is a production deployment of the Dispatcher
        if: ${{ inputs.dispatcher_deployment != '' }}
        env:
          DEPLOYMENT: ${{ inputs.dispatcher_deployment }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_DISPATCHER_PROJECT_ID }}
        run: pnpm --dir dispatcher snapshot:ops verify --deployment "$DEPLOYMENT" --check-snapshot
      - name: Roll the App back
        if: ${{ inputs.app_deployment != '' }}
        env:
          DEPLOYMENT: ${{ inputs.app_deployment }}
          VERCEL_ORG_ID: ${{ env.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_APP_PROJECT_ID }}
        run: vercel rollback "$DEPLOYMENT" --yes --timeout 5m
      - name: Roll the Dispatcher back
        if: ${{ inputs.dispatcher_deployment != '' }}
        env:
          DEPLOYMENT: ${{ inputs.dispatcher_deployment }}
          VERCEL_ORG_ID: ${{ env.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_DISPATCHER_PROJECT_ID }}
        run: vercel rollback "$DEPLOYMENT" --yes --timeout 5m
      - name: Write the restored Dispatcher's golden snapshot pair back to Infisical
        if: ${{ inputs.dispatcher_deployment != '' }}
        uses: ./.github/actions/infisical-write-snapshot-pair
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          from-deployment: ${{ inputs.dispatcher_deployment }}
          vercel-project-id: ${{ env.VERCEL_DISPATCHER_PROJECT_ID }}
