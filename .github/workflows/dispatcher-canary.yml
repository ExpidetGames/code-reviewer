name: Dispatcher canary

# The deploy canary of the hosted deployment (#316, #331, #403): calls `POST /probe` of a deployed Dispatcher, which runs
# the Worker image's `probe` mode in a canary VM cloned from the golden snapshot with the real container flags, and
# fails when the Dynamic-Worker's canary does not pass (the hardening, the egress mode, IPv6 off where it is required,
# the self-check). deploy-production.yml calls it between "stage the Dispatcher" and "promote": a failing canary
# blocks the release. It can also be started by hand on a staged production deployment (docs/golden-snapshot.md,
# "Rebuild").
#
# It never runs for a pull request, and only from main (the job's condition: a manual run would otherwise run the
# code of any branch with the Infisical sign-in of the environment `production`, which is restricted to main as
# well). It sends the dispatcher credential to the one URL it is given, and only after the Vercel API, asked with
# the access token from Infisical, has confirmed that the deployment behind the host belongs to the Dispatcher
# project and the team, as a ready production deployment built from the commit of this run (https, no redirect
# followed, the deployment's own address and not an alias): every staged deployment has a host of its own, so there is
# no list of hosts to keep. When `image_digest` and `snapshot_id` are given, the canary must also find that Worker image id
# and that snapshot id in the Dispatcher's own report, which proves the pair the pipeline built and not whichever one the
# variables name (a rebuild of the same layers keeps the image id and changes the snapshot). It prints only stable codes. The
# credentials are loaded from Infisical /ci by one step, as environment variables, never in a command line or a log.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL of the staged Dispatcher deployment (https://....vercel.app)"
        required: true
      engines:
        description: "Engines the release needs: pr-agent,opencode, or pr-agent for a Diff-only deployment"
        default: "pr-agent,opencode"
        required: false
      image_digest:
        description: "Worker image id the deployment must report (sha256:...); empty does not check the image"
        default: ""
        required: false
      snapshot_id:
        description: "Golden snapshot id the deployment must report; empty does not check the snapshot"
        default: ""
        required: false
  workflow_call:
    inputs:
      url:
        description: "Base URL of the deployed Dispatcher (https)"
        required: true
        type: string
      engines:
        description: "Engines the release needs: pr-agent,opencode, or pr-agent"
        default: "pr-agent,opencode"
        required: false
        type: string
      image_digest:
        description: "Worker image id the deployment must report (sha256:...); empty does not check the image"
        default: ""
        required: false
        type: string
      snapshot_id:
        description: "Golden snapshot id the deployment must report; empty does not check the snapshot"
        default: ""
        required: false
        type: string

permissions:
  contents: read

# Runs queue one behind the other: each one creates a canary VM, and a cancelled run could leave one running.
concurrency:
  group: dispatcher-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Prove the Dynamic-Worker canary of a deployment
    if: ${{ github.repository == 'ExpidetGames/code-reviewer' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds the Infisical sign-in as secrets; its deployment branches are restricted to main.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: dispatcher/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        working-directory: dispatcher
        run: pnpm install --frozen-lockfile
      # After the install and just before the step that uses them. RUNNER_TOKEN is the Dispatcher project's dispatcher
      # credential, the bypass secret is the Dispatcher project's Protection Bypass for Automation secret, and the
      # token, the team and the project id let the canary ask the platform whom the staged host belongs to.
      - name: Load the credentials from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: RUNNER_TOKEN VERCEL_TOKEN VERCEL_TEAM_ID VERCEL_DISPATCHER_PROJECT_ID VERCEL_DISPATCHER_AUTOMATION_BYPASS_SECRET
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: The canary did not run, so nothing is promoted.
      # A snapshot that was removed since (a re-run of failed jobs after the run's snapshot was discarded) is said so
      # here, in a code, and not as a canary VM that cannot start.
      - name: Check that the golden snapshot still exists
        if: ${{ inputs.snapshot_id != '' }}
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_DISPATCHER_PROJECT_ID }}
          PAIR_SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: pnpm --dir dispatcher snapshot:ops exists
      # `--verify-vercel` reads VERCEL_TOKEN, VERCEL_TEAM_ID and VERCEL_PROJECT_ID (the Dispatcher project) from the
      # environment; the canary command reads RUNNER_TOKEN and the bypass secret from it too.
      - name: Run the canary
        working-directory: dispatcher
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_DISPATCHER_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ env.VERCEL_DISPATCHER_AUTOMATION_BYPASS_SECRET }}
          CANARY_URL: ${{ inputs.url }}
          CANARY_ENGINES: ${{ inputs.engines || 'pr-agent,opencode' }}
          CANARY_EXPECT_IMAGE_DIGEST: ${{ inputs.image_digest }}
          CANARY_EXPECT_SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: pnpm probe:canary --url "$CANARY_URL" --verify-vercel --expect-commit "$GITHUB_SHA" --engines "$CANARY_ENGINES"
