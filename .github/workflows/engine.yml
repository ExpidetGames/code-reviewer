name: Engine tests

# The engine suite: the real, pinned PR-Agent through the job entry point against a fake GitHub and
# a fake LLM, and the real, pinned stock OpenCode behind the runner's model proxy against a scripted
# loopback model (runner/tests/engine). One definition for the two workflows that run it: ci.yml (pull
# requests that change the runner and pull requests into main) and nightly.yml. It is not started
# by anything else. No repository secrets: the fakes need none, and the suite must never talk to a
# real model or a real GitHub. The caller's token (contents: read) is all this workflow can use.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  engine:
    name: "Runner: engine tests (real PR-Agent, fake GitHub and LLM)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: runner/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      # The engine's grep and glob run ripgrep; the pinned OpenCode downloads one when none is on
      # its PATH, which the runner never allows. The runner image will carry the same tool (#202).
      # Both come from the runner's apt and are not version-pinned: the supply-chain audit of what
      # the image installs (with the OpenCode binary and its Bun lock) is part of #202. nftables is
      # what the privileged step needs to prove the engine user's network rules.
      - name: Install ripgrep and nftables
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep nftables
      # PR-Agent counts tokens with a tiktoken encoding that it downloads on first use. The
      # download is the only network use of this job besides the installation, so it is cached.
      - name: Restore the tiktoken encoding
        uses: actions/cache@v4
        with:
          path: /tmp/data-gym-cache
          key: tiktoken-o200k_base-v1
      # The pinned OpenCode (runner/opencode-pin.json) is downloaded by scripts/fetch_opencode.py,
      # which accepts it only with the pinned size and SHA-256; the cache just saves the download.
      - name: Restore the pinned OpenCode
        uses: actions/cache@v4
        with:
          path: ~/.cache/code-reviewer/opencode
          key: opencode-${{ hashFiles('runner/opencode-pin.json') }}
      # Fills the caches if needed (with retries), then runs `pytest -m engine` in a network
      # namespace that has a loopback interface and nothing else.
      - name: Engine tests without network
        run: scripts/run_engine_offline.sh
      # The privileged suite (#197): root with exactly the capabilities of compose.dynamic.yml, the
      # dedicated engine user, the per-user nft rules and the kill of that user's processes, in a
      # namespace with nothing but loopback. Uses the pinned OpenCode fetched above.
      - name: Privileged tests (dedicated engine user, network rules)
        run: scripts/run_privileged_offline.sh
