name: Deploy production

# Deploys the hosted version (the App and the Dispatcher) to Vercel production (#403). A push to main, or a manual
# run on main, goes through these jobs, and a failure of any job before `promote-app` leaves production on the
# deployments and the golden snapshot it has. Merging to main is the whole release: there is no manual step.
#
#   fresh -> migrate -> snapshot-decide -> snapshot-build (only if needed) -+
#                    -> stage-app -----------------------------------------+-> stage-dispatcher
#                                    -> health-app ------------------------+--> canary
#   canary -> promote-app -> promote-dispatcher -> persist -> cleanup           (discard: a run that did not get live)
#
#  1. fresh: the commit of this run is still the head of main; an older run (a re-run) is refused.
#  2. migrate: `pnpm --dir app migrate` against the migrate role's URL. A failed migration means no deployment.
#  3. snapshot-decide: does the Worker image need a new golden snapshot? Yes if an input of the image
#     (dispatcher/src/snapshot/pair.ts, IMAGE_INPUT_PATHS) changed since the commit of the snapshot in use, if that
#     commit or the pair is missing, or if asked to. Otherwise the pair in use is reused.
#  4. snapshot-build: golden-snapshot.yml, when needed. It builds, checks and records the snapshot and removes nothing.
#  5. stage-app, stage-dispatcher: a staged production deployment of each project (vercel-stage.yml), the App first
#     (docs/deployment-vercel.md, section 5.6). The Dispatcher's carries the pair of this run as its own run-time
#     variables and meta. The project's variables, Infisical and the live deployment are not touched.
#  6. health-app: the staged App answers `/api/health` with 200 and `{"status":"ok"}`.
#  7. canary: dispatcher-canary.yml on the staged Dispatcher, which must report the snapshot id and the image id of
#     the pair of this run: the new snapshot is proven by the deployment that will use it.
#  8. promote-app, promote-dispatcher: `vercel promote`, one job per project, so that a partial promotion is recorded
#     as it is. Each checks again, right before it acts, that the commit is still the head of main (a re-run of the
#     failed jobs of an old run skips `fresh`). They run whether the snapshot was rebuilt or reused (snapshot-build
#     skipped), and only when every job they need succeeded.
#  9. persist: only after the Dispatcher is live, the pair is written to Infisical /dispatcher (the one write path of
#     the repository, its own composite action), and Secret Sync carries it to the project's variables for later
#     deployments. A failure here fails the run: production runs the new pair but the variables are behind. The next
#     run reads the live deployment's meta, finds the live pair, and writes it again (docs, section 5.1).
# 10. cleanup: after every promotion of the Dispatcher (and after persist, when persist had something to do), every
#     golden snapshot but the new one and the one before it (the rollback target) is removed, and never the one the
#     live deployment runs. A keep list is safe to repeat, so it also clears what an earlier run could not. `discard`
#     removes the snapshot of a run that built one and whose Dispatcher promotion never started; after a failed or
#     cancelled promotion the outcome is unknown (it can still land) and the snapshot is left to the next cleanup.
#
# The second App ("factory", #732) is a lane of this pipeline that exists but is dormant. The repository variable
# FACTORY_ENABLED (a repository variable, not an environment variable of `production`; a boolean, harmless in a public
# repository) is read once, by `factory-flag`, and every factory job reads its output. Unset or not `true`, the
# pipeline does exactly what it did before. Switched on, the same `app/` is deployed to a second Vercel project with its
# own database:
#
#   factory-flag -> migrate-factory -> stage-factory -> health-factory ---+
#   canary -> apps-check -------------------------------------------------+-> promote-factory
#   promote-app -> promote-factory -> promote-dispatcher                 (promote-factory: only after the App)
#
# The factory never blocks the release of code-review.com. The reviewer's jobs (everything above this lane) need no
# factory job, so a factory migration, staging, health check, Apps check or promotion that fails or is skipped changes
# nothing of the reviewer's release. `promote-dispatcher` waits for `promote-factory` to finish (apps first, the
# Dispatcher last) but does not look at its result, so a factory job that hangs delays the Dispatcher's promotion up to
# the time limits below, which is why they are short. A failed factory lane fails the run, loudly, after the
# reviewer's production is promoted. docs/deployment-vercel.md, section 5.8, lists exactly what a factory failure can
# still touch, the rollout order and how to switch it off.
#
# Production only: no staging, no preview. It never runs for a pull request and never on `pull_request_target`. Every
# job runs only for this repository on main (the job's own condition guards against accidents; the boundary is the
# environment `production`, restricted to main, which holds the Infisical sign-in as secrets). Deployments queue one
# behind the other and are never cancelled: a migration or a promotion in progress runs to its end.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      canary_engines:
        description: "Engines the canary requires: pr-agent,opencode, or pr-agent for a Diff-only deployment"
        default: "pr-agent,opencode"
        required: false
      rebuild_snapshot:
        description: "Build a new golden snapshot even if the Worker image inputs did not change (the platform's base image changed, say)"
        type: boolean
        default: false
        required: false
      allow_stale:
        description: "Deploy even though a newer commit is on main (deliberate, for a re-run of an old commit)"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_TELEMETRY_DISABLED: "1"

jobs:
  # A re-run of an old run rebuilds that run's commit. Without this it would be staged and promoted over a newer
  # production. Needs no secret. "Re-run failed jobs" skips a job that succeeded, so the jobs that promote or write
  # run the same check themselves, right before they act.
  fresh:
    name: Check that the commit is the head of main
    if: ${{ github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/check-current-commit
        with:
          github-token: ${{ github.token }}
          allow-stale: ${{ inputs.allow_stale }}

  migrate:
    name: Migrate the database
    needs: fresh
    if: ${{ github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter code-reviewer-app...
      # After the install and just before the command that uses it.
      - name: Load the migrate role's database URL from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: DATABASE_URL_MIGRATE
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: Nothing was migrated, so nothing is deployed.
      # Takes the advisory lock, applies every pending migration in one transaction and prints the number applied,
      # never the URL (docs/deployment-vercel.md, step 1). Idempotent: a run with nothing to apply exits 0.
      - name: Apply the migrations
        run: pnpm --dir app migrate

  # The one place that reads the repository variable FACTORY_ENABLED (#732). It has no secret and nothing of the
  # reviewer's path needs it; every factory job reads its output, so that the switch is read once per run.
  factory-flag:
    name: Read the factory switch
    if: ${{ github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.flag.outputs.enabled }}
    steps:
      - name: Read FACTORY_ENABLED
        id: flag
        env:
          FACTORY_ENABLED: ${{ vars.FACTORY_ENABLED }}
        run: |
          set -euo pipefail

          if [ "${FACTORY_ENABLED}" = "true" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "The factory lane is on."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "The factory lane is off."
          fi

  # The factory's own migration (#732), in a job of its own: the reviewer's `migrate` does not depend on it and nothing
  # of the reviewer's path needs it. Same command, the factory's database.
  migrate-factory:
    name: Migrate the factory database
    needs: [fresh, factory-flag]
    if: ${{ github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' && needs.factory-flag.outputs.enabled == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter code-reviewer-app...
      - name: Load the factory migrate role's database URL from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: DATABASE_URL_MIGRATE_FACTORY
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: Nothing was migrated, so the factory is not deployed.
      - name: Apply the migrations to the factory database
        env:
          DATABASE_URL_MIGRATE: ${{ env.DATABASE_URL_MIGRATE_FACTORY }}
        run: pnpm --dir app migrate

  snapshot-decide:
    name: Decide whether the golden snapshot is rebuilt
    needs: migrate
    if: ${{ github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    outputs:
      rebuild: ${{ steps.decide.outputs.rebuild }}
      reason: ${{ steps.decide.outputs.reason }}
      repair: ${{ steps.decide.outputs.repair }}
      snapshot-id: ${{ steps.decide.outputs.snapshot-id }}
      image-digest: ${{ steps.decide.outputs.image-digest }}
      commit: ${{ steps.decide.outputs.commit }}
      previous-snapshot-id: ${{ steps.decide.outputs.previous-snapshot-id }}
    steps:
      # The whole history: the commit of the snapshot in use is compared with this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter code-reviewer-dispatcher...
      - name: Install the Vercel CLI
        uses: ./.github/actions/vercel-cli
      - name: Load the Vercel credentials from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: VERCEL_TOKEN VERCEL_TEAM_ID VERCEL_DISPATCHER_PROJECT_ID
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: Nothing is deployed.
      # The variables of the Dispatcher project as a deployment made now would get them. Read-only: nothing is built.
      - name: Pull the Dispatcher's production variables
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_DISPATCHER_PROJECT_ID }}
        run: vercel pull --yes --environment=production
      - name: Decide
        id: decide
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_DISPATCHER_PROJECT_ID }}
          FORCE: ${{ inputs.rebuild_snapshot }}
        run: |
          set -euo pipefail
          args=(decide --sha "${GITHUB_SHA}" --env-file "${GITHUB_WORKSPACE}/.vercel/.env.production.local" --github-output "${GITHUB_OUTPUT}")
          if [ "${FORCE}" = "true" ]; then
            args+=(--force)
          fi
          pnpm --dir dispatcher snapshot:ops "${args[@]}"

  snapshot-build:
    name: Build the golden snapshot
    needs: snapshot-decide
    if: ${{ github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' && needs.snapshot-decide.outputs.rebuild == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/golden-snapshot.yml
    secrets:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
      INFISICAL_PROJECT_SLUG: ${{ secrets.INFISICAL_PROJECT_SLUG }}

  stage-app:
    name: Stage the App
    needs: migrate
    if: ${{ github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/vercel-stage.yml
    secrets:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
      INFISICAL_PROJECT_SLUG: ${{ secrets.INFISICAL_PROJECT_SLUG }}
    with:
      project: app
      directory: app
      project-id-secret: VERCEL_APP_PROJECT_ID
      ref: ${{ github.sha }}

  # After the App: a release that changes the runner API needs the App first (docs/deployment-vercel.md, 5.6). The
  # snapshot job may have been skipped (nothing to rebuild), which is why the condition names the results.
  stage-dispatcher:
    name: Stage the Dispatcher
    needs: [stage-app, snapshot-decide, snapshot-build]
    if: ${{ !cancelled() && github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' && needs.stage-app.result == 'success' && needs.snapshot-decide.result == 'success' && (needs.snapshot-build.result == 'success' || needs.snapshot-build.result == 'skipped') }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/vercel-stage.yml
    secrets:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
      INFISICAL_PROJECT_SLUG: ${{ secrets.INFISICAL_PROJECT_SLUG }}
    with:
      project: dispatcher
      directory: dispatcher
      project-id-secret: VERCEL_DISPATCHER_PROJECT_ID
      ref: ${{ github.sha }}
      snapshot-id: ${{ needs.snapshot-build.outputs.snapshot-id || needs.snapshot-decide.outputs.snapshot-id }}
      image-digest: ${{ needs.snapshot-build.outputs.image-digest || needs.snapshot-decide.outputs.image-digest }}
      snapshot-commit: ${{ needs.snapshot-build.outputs.commit || needs.snapshot-decide.outputs.commit }}

  # The second App (#732): the same `app/` as `stage-app`, deployed to the factory's own Vercel project, which takes its
  # variables from the factory's folder in Infisical, so the product and its capability set come from the project.
  # In parallel with the App. Nothing downstream of the reviewer's path needs it.
  stage-factory:
    name: Stage the factory App
    needs: [factory-flag, migrate-factory]
    if: ${{ github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' && needs.factory-flag.outputs.enabled == 'true' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/vercel-stage.yml
    secrets:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
      INFISICAL_PROJECT_SLUG: ${{ secrets.INFISICAL_PROJECT_SLUG }}
    with:
      project: factory
      directory: app
      project-id-secret: VERCEL_FACTORY_PROJECT_ID
      ref: ${{ github.sha }}

  health-app:
    name: Check the staged App's health
    needs: stage-app
    if: ${{ github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # The staged address is under Deployment Protection (every address but the production domains is), so the
      # Protection Bypass for Automation secret of the App project opens it.
      - name: Load the App's bypass secret from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: VERCEL_APP_AUTOMATION_BYPASS_SECRET
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: The staged App was not checked, so nothing is promoted.
      # 200 with {"status":"ok"} or the check fails. 503 {"status":"error","code":"SCHEMA_BEHIND"} means the
      # migration did not reach this database; any other answer is retried for about five minutes (a cold start, a
      # database that is waking up) and then fails. Only a status code and a stable error code are printed, never a
      # body. No redirect is followed, and the secret goes only to a Vercel deployment address, in a header file
      # (an argument would show up in the process list).
      - name: Check /api/health of the staged App
        env:
          DEPLOYMENT_URL: ${{ needs.stage-app.outputs.url }}
        run: |
          set -euo pipefail

          if ! [[ "${DEPLOYMENT_URL}" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
            echo "::error::The staged App has no deployment address."
            exit 1
          fi
          umask 077
          header_file="${RUNNER_TEMP}/bypass-header"
          printf 'x-vercel-protection-bypass: %s\n' "${VERCEL_APP_AUTOMATION_BYPASS_SECRET}" > "${header_file}"
          body_file="${RUNNER_TEMP}/health.json"

          status=000
          for attempt in $(seq 1 12); do
            status="$(
              curl --silent --output "${body_file}" --write-out '%{http_code}' --max-time 15 \
                --header @"${header_file}" "${DEPLOYMENT_URL}/api/health" || true
            )"
            if [ "${status}" = "200" ] && jq -e '.status == "ok"' "${body_file}" > /dev/null 2>&1; then
              echo "The staged App is healthy (attempt ${attempt})."
              exit 0
            fi
            code="$(jq -r '.code // empty | select(test("^[A-Z_]{1,40}$"))' "${body_file}" 2> /dev/null || true)"
            if [ "${code}" = "SCHEMA_BEHIND" ]; then
              echo "::error::The staged App reports SCHEMA_BEHIND: the database is behind this version. Nothing is promoted."
              exit 1
            fi
            echo "Attempt ${attempt}: status ${status}${code:+, code ${code}}"
            sleep 10
          done
          echo "::error::The staged App did not report a healthy state. Nothing is promoted."
          exit 1

  # A copy of health-app for the factory's project, with one more proof: the staged App reports the product and the
  # capability set this project is meant to run, so that crossed project variables (the reviewer's on the factory's
  # project, or the other way round) are never promoted. `PRODUCT_MISMATCH` is final, it is not retried.
  health-factory:
    name: Check the staged factory App's health
    needs: [factory-flag, stage-factory]
    if: ${{ github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' && needs.factory-flag.outputs.enabled == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Load the factory App's bypass secret from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: VERCEL_FACTORY_AUTOMATION_BYPASS_SECRET
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: The staged factory App was not checked, so it is not promoted.
      - name: Check /api/health of the staged factory App
        env:
          DEPLOYMENT_URL: ${{ needs.stage-factory.outputs.url }}
          EXPECTED_PRODUCT: factory
          # The capability set of the factory's PRODUCT_CAPABILITIES. The repository variable changes together with
          # that setting (docs/deployment-vercel.md, section 5.8); unset or empty it is the set of today.
          EXPECTED_CAPABILITIES: ${{ vars.FACTORY_EXPECTED_CAPABILITIES || 'dynamic-review,review' }}
        run: |
          set -euo pipefail

          # The value comes from a repository variable: check its shape before anything is requested, and never
          # print it unchanged (a workflow command or a line break in it must not reach the log).
          KNOWN_CAPABILITIES="billing dynamic-review implementer review"
          capability_error() {
            local shown
            shown="$(printf '%s' "${EXPECTED_CAPABILITIES}" | tr -c 'a-z0-9,-' '?' | cut -c1-120)"
            echo "::error::FACTORY_EXPECTED_CAPABILITIES is malformed: $1 (value: ${shown}). It must be the factory's capability names, comma separated, sorted alphabetically, without spaces, empty entries or duplicates. Nothing is promoted."
            exit 1
          }
          if ! [[ "${EXPECTED_CAPABILITIES}" =~ ^[a-z-]+(,[a-z-]+)*$ ]]; then
            capability_error "it has a character, a space or an empty entry that is not allowed"
          fi
          previous=""
          IFS=',' read -r -a entries <<< "${EXPECTED_CAPABILITIES}"
          for entry in "${entries[@]}"; do
            if ! [[ " ${KNOWN_CAPABILITIES} " == *" ${entry} "* ]]; then
              capability_error "an entry is not a known capability name"
            fi
            if [ "${entry}" = "${previous}" ]; then
              capability_error "an entry is listed twice"
            fi
            if [ -n "${previous}" ] && [[ "${entry}" < "${previous}" ]]; then
              capability_error "the entries are not sorted alphabetically"
            fi
            previous="${entry}"
          done

          if ! [[ "${DEPLOYMENT_URL}" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
            echo "::error::The staged factory App has no deployment address."
            exit 1
          fi
          umask 077
          header_file="${RUNNER_TEMP}/bypass-header"
          printf 'x-vercel-protection-bypass: %s\n' "${VERCEL_FACTORY_AUTOMATION_BYPASS_SECRET}" > "${header_file}"
          body_file="${RUNNER_TEMP}/health.json"

          status=000
          for attempt in $(seq 1 12); do
            status="$(
              curl --silent --output "${body_file}" --write-out '%{http_code}' --max-time 15 \
                --header @"${header_file}" "${DEPLOYMENT_URL}/api/health" || true
            )"
            if [ "${status}" = "200" ] && jq -e '.status == "ok"' "${body_file}" > /dev/null 2>&1; then
              if ! jq -e --arg product "${EXPECTED_PRODUCT}" --arg capabilities "${EXPECTED_CAPABILITIES}" \
                '.product == $product and ((.capabilities | type) == "array") and ((.capabilities | sort | join(",")) == $capabilities)' \
                "${body_file}" > /dev/null 2>&1; then
                reported="$(jq -r '.product // empty | select(type == "string" and test("^[a-z][a-z0-9-]{0,31}$"))' "${body_file}" 2> /dev/null || true)"
                echo "::error::PRODUCT_MISMATCH: the staged factory App reports ${reported:-no product}, expected ${EXPECTED_PRODUCT} with the capabilities ${EXPECTED_CAPABILITIES}. Nothing is promoted."
                exit 1
              fi
              echo "The staged factory App is healthy (attempt ${attempt})."
              exit 0
            fi
            code="$(jq -r '.code // empty | select(test("^[A-Z_]{1,40}$"))' "${body_file}" 2> /dev/null || true)"
            if [ "${code}" = "SCHEMA_BEHIND" ]; then
              echo "::error::The staged factory App reports SCHEMA_BEHIND: the factory database is behind this version. Nothing is promoted."
              exit 1
            fi
            echo "Attempt ${attempt}: status ${status}${code:+, code ${code}}"
            sleep 10
          done
          echo "::error::The staged factory App did not report a healthy state. Nothing is promoted."
          exit 1

  canary:
    name: Run the Dispatcher canary
    needs: [stage-dispatcher, health-app, snapshot-decide, snapshot-build]
    if: ${{ github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' && !cancelled() && needs.stage-dispatcher.result == 'success' && needs.health-app.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/dispatcher-canary.yml
    secrets:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
      INFISICAL_PROJECT_SLUG: ${{ secrets.INFISICAL_PROJECT_SLUG }}
    with:
      url: ${{ needs.stage-dispatcher.outputs.url }}
      engines: ${{ inputs.canary_engines || 'pr-agent,opencode' }}
      image_digest: ${{ needs.snapshot-build.outputs.image-digest || needs.snapshot-decide.outputs.image-digest }}
      snapshot_id: ${{ needs.snapshot-build.outputs.snapshot-id || needs.snapshot-decide.outputs.snapshot-id }}

  # What the staged Dispatcher says about every App it serves (#730): each must be reachable with its credential. Runs
  # on the staged Dispatcher the canary just proved to belong to the Dispatcher project, so the operator credential goes
  # only there. Blocking for the factory's promotion only; a missing feature is a warning (the live Apps are still the
  # previous release at this point). The reviewer's promotion does not need it.
  apps-check:
    name: Check the Apps of the staged Dispatcher
    needs: [factory-flag, stage-dispatcher, canary]
    if: ${{ !cancelled() && github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' && needs.factory-flag.outputs.enabled == 'true' && needs.stage-dispatcher.result == 'success' && needs.canary.result == 'success' }}
    runs-on: ubuntu-24.04
    # One request of at most a minute after the checkout and the sign-in. It sits in front of promote-dispatcher, so a hang is a delay of the reviewer's release.
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Load the Dispatcher's credentials from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: DISPATCHER_OPERATOR_TOKEN VERCEL_DISPATCHER_AUTOMATION_BYPASS_SECRET
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: The Apps of the staged Dispatcher were not checked, so the factory is not promoted.
      # Only a status code and stable codes with an App id are printed, never a body. No redirect is followed, and the
      # credentials go only to a Vercel deployment address, in a header file (an argument would show up in the process list).
      - name: Ask the staged Dispatcher about its Apps
        env:
          DISPATCHER_URL: ${{ needs.stage-dispatcher.outputs.url }}
        run: |
          set -euo pipefail

          if ! [[ "${DISPATCHER_URL}" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
            echo "::error::The staged Dispatcher has no deployment address."
            exit 1
          fi
          umask 077
          header_file="${RUNNER_TEMP}/apps-check-headers"
          {
            printf 'x-vercel-protection-bypass: %s\n' "${VERCEL_DISPATCHER_AUTOMATION_BYPASS_SECRET}"
            printf 'authorization: Bearer %s\n' "${DISPATCHER_OPERATOR_TOKEN}"
          } > "${header_file}"
          body_file="${RUNNER_TEMP}/apps-check.json"

          status="$(
            curl --silent --output "${body_file}" --write-out '%{http_code}' --max-time 60 --request POST \
              --header @"${header_file}" "${DISPATCHER_URL}/apps/check" || true
          )"
          if [ "${status}" != "200" ]; then
            echo "::error::apps_check_failed: the staged Dispatcher answered ${status} to /apps/check."
            exit 1
          fi
          if ! jq -e '(.apps | type) == "array" and (.apps | length) > 0' "${body_file}" > /dev/null 2>&1; then
            echo "::error::apps_check_unreadable: the answer lists no Apps."
            exit 1
          fi

          # An App id is printed only when it has the shape of one.
          errors="$(
            jq -r '.apps[]
              | (.id | if type == "string" and test("^[a-z][a-z0-9-]{0,23}$") then . else "?" end) as $id
              | if .reachable == false then "::error::app_unreachable: " + $id
                elif .credentialAccepted == false then "::error::app_rejected: " + $id
                else empty end' "${body_file}"
          )"
          jq -r '.apps[]
            | (.id | if type == "string" and test("^[a-z][a-z0-9-]{0,23}$") then . else "?" end) as $id
            | select((.missingFeatures // []) | length > 0)
            | "::warning::app_missing_features: " + $id' "${body_file}"
          if [ -n "${errors}" ]; then
            echo "${errors}"
            exit 1
          fi
          echo "Every App of the staged Dispatcher is reachable and accepts its credential."

  # The conditions of the two promotions name `!cancelled()` and every job they need, for the same reason as
  # stage-dispatcher: without a status function GitHub adds an implicit success() that is false when any job up the
  # chain was skipped, and snapshot-build is skipped on every run that reuses the snapshot (#480). Nothing else may be
  # skipped or fail: each needed job must have succeeded.
  promote-app:
    name: Promote the App
    needs: [stage-app, stage-dispatcher, health-app, canary]
    if: ${{ !cancelled() && github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' && needs.stage-app.result == 'success' && needs.stage-dispatcher.result == 'success' && needs.health-app.result == 'success' && needs.canary.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install the Vercel CLI
        uses: ./.github/actions/vercel-cli
      - name: Load the Vercel credentials from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: VERCEL_TOKEN VERCEL_TEAM_ID VERCEL_APP_PROJECT_ID
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: Nothing is promoted; production stays on its previous deployments.
      # Right before the promotion, so that a re-run of failed jobs of an old run cannot skip it.
      - uses: ./.github/actions/check-current-commit
        with:
          github-token: ${{ github.token }}
          allow-stale: ${{ inputs.allow_stale }}
      # The App first. The CLI reads the token from VERCEL_TOKEN, the team and the project from the environment.
      - name: Promote the App
        env:
          DEPLOYMENT_URL: ${{ needs.stage-app.outputs.url }}
          VERCEL_ORG_ID: ${{ env.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_APP_PROJECT_ID }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --timeout 5m

  # After the App and before the Dispatcher (apps first, docs/deployment-vercel.md, section 5.6). Everything it needs
  # must have succeeded. Its result is never looked at by a job of the reviewer's path.
  promote-factory:
    name: Promote the factory App
    needs: [factory-flag, stage-factory, health-factory, canary, apps-check, promote-app]
    if: ${{ !cancelled() && github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' && needs.factory-flag.outputs.enabled == 'true' && needs.stage-factory.result == 'success' && needs.health-factory.result == 'success' && needs.canary.result == 'success' && needs.apps-check.result == 'success' && needs.promote-app.result == 'success' }}
    runs-on: ubuntu-24.04
    # `vercel promote --timeout 5m` after the setup. It sits in front of promote-dispatcher, so a hang is a delay of the reviewer's release.
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install the Vercel CLI
        uses: ./.github/actions/vercel-cli
      - name: Load the Vercel credentials from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: VERCEL_TOKEN VERCEL_TEAM_ID VERCEL_FACTORY_PROJECT_ID
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: Nothing is promoted; the factory stays on its previous deployment.
      - uses: ./.github/actions/check-current-commit
        with:
          github-token: ${{ github.token }}
          allow-stale: ${{ inputs.allow_stale }}
      - name: Promote the factory App
        env:
          DEPLOYMENT_URL: ${{ needs.stage-factory.outputs.url }}
          VERCEL_ORG_ID: ${{ env.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_FACTORY_PROJECT_ID }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --timeout 5m

  promote-dispatcher:
    name: Promote the Dispatcher
    # promote-factory is here for the order only (apps first, the Dispatcher last): the condition below never reads its result.
    needs: [stage-app, stage-dispatcher, health-app, canary, promote-app, promote-factory]
    if: ${{ !cancelled() && github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' && needs.stage-app.result == 'success' && needs.stage-dispatcher.result == 'success' && needs.health-app.result == 'success' && needs.canary.result == 'success' && needs.promote-app.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install the Vercel CLI
        uses: ./.github/actions/vercel-cli
      - name: Load the Vercel credentials from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: VERCEL_TOKEN VERCEL_TEAM_ID VERCEL_DISPATCHER_PROJECT_ID
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: The Dispatcher is not promoted; production stays on its previous Dispatcher.
      - uses: ./.github/actions/check-current-commit
        with:
          github-token: ${{ github.token }}
          allow-stale: ${{ inputs.allow_stale }}
      - name: Promote the Dispatcher
        env:
          DEPLOYMENT_URL: ${{ needs.stage-dispatcher.outputs.url }}
          VERCEL_ORG_ID: ${{ env.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_DISPATCHER_PROJECT_ID }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --timeout 5m

  # Only after the Dispatcher is live: the pair production runs is written to Infisical, where Secret Sync carries it
  # to the project's variables. Also when nothing was rebuilt but the variables are behind the live pair (an earlier
  # run could not write them). This and the rollback are the only jobs that use the write path.
  persist:
    name: Write the golden snapshot pair to Infisical
    needs: [snapshot-decide, snapshot-build, promote-dispatcher]
    if: ${{ !cancelled() && github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' && needs.promote-dispatcher.result == 'success' && (needs.snapshot-decide.outputs.rebuild == 'true' || needs.snapshot-decide.outputs.repair == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter code-reviewer-dispatcher...
      # A pair of an older run must not overwrite a newer one: if main moved on, the next run finds the live pair and
      # writes it itself (the repair).
      - uses: ./.github/actions/check-current-commit
        with:
          github-token: ${{ github.token }}
          allow-stale: ${{ inputs.allow_stale }}
      - name: Write the pair
        uses: ./.github/actions/infisical-write-snapshot-pair
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          snapshot-id: ${{ needs.snapshot-build.outputs.snapshot-id || needs.snapshot-decide.outputs.snapshot-id }}
          image-digest: ${{ needs.snapshot-build.outputs.image-digest || needs.snapshot-decide.outputs.image-digest }}
          commit: ${{ needs.snapshot-build.outputs.commit || needs.snapshot-decide.outputs.commit }}

  # After the promotion, and after persist when it ran: the new and the previous snapshot stay (the previous
  # deployment, the rollback target, still references it), the live one is never removed, everything else the pipeline
  # built goes (young builders and unmanaged ones excepted, see ops-cli.ts).
  cleanup:
    name: Remove the golden snapshots nobody needs
    needs: [snapshot-decide, snapshot-build, promote-dispatcher, persist]
    if: ${{ !cancelled() && github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' && needs.promote-dispatcher.result == 'success' && (needs.persist.result == 'success' || needs.persist.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter code-reviewer-dispatcher...
      - name: Load the Vercel credentials from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: VERCEL_TOKEN VERCEL_TEAM_ID VERCEL_DISPATCHER_PROJECT_ID
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: Old golden snapshots were not removed; the next deployment that rebuilds removes them.
      - name: Remove the old snapshots
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_DISPATCHER_PROJECT_ID }}
          NEW_SNAPSHOT_ID: ${{ needs.snapshot-build.outputs.snapshot-id || needs.snapshot-decide.outputs.snapshot-id }}
          PREVIOUS_SNAPSHOT_ID: ${{ needs.snapshot-decide.outputs.previous-snapshot-id }}
        run: |
          set -euo pipefail
          export KEEP_SNAPSHOT_IDS="${NEW_SNAPSHOT_ID} ${PREVIOUS_SNAPSHOT_ID}"
          pnpm --dir dispatcher snapshot:ops cleanup

  # A run that built a snapshot and whose Dispatcher promotion never started: the snapshot is removed (still not if the
  # live deployment uses it). After a promotion that failed, timed out or was cancelled the outcome is unknown, since a
  # promotion that was requested can still land, so nothing is removed: the next cleanup keeps the live one and removes
  # the rest.
  discard:
    name: Discard the snapshot of a run that did not get live
    needs: [snapshot-decide, snapshot-build, promote-dispatcher]
    if: ${{ always() && github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' && needs.snapshot-build.result == 'success' && needs.promote-dispatcher.result == 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter code-reviewer-dispatcher...
      - name: Load the Vercel credentials from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: VERCEL_TOKEN VERCEL_TEAM_ID VERCEL_DISPATCHER_PROJECT_ID
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: The snapshot of this run was not removed; the next deployment that rebuilds removes it.
      - name: Discard the new snapshot
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_DISPATCHER_PROJECT_ID }}
          DISCARD_SNAPSHOT_ID: ${{ needs.snapshot-build.outputs.snapshot-id }}
          PREVIOUS_SNAPSHOT_ID: ${{ needs.snapshot-decide.outputs.previous-snapshot-id }}
        run: |
          set -euo pipefail
          export KEEP_SNAPSHOT_IDS="${PREVIOUS_SNAPSHOT_ID}"
          pnpm --dir dispatcher snapshot:ops cleanup

  # Closes the GitHub deployment records of the stages (the factory's only when it ran), each with what happened to it: a
  # project is `success` only if its own promotion went through.
  record:
    name: Close the GitHub deployments
    needs: [stage-app, stage-dispatcher, stage-factory, promote-app, promote-dispatcher, promote-factory]
    if: ${{ always() && github.repository == 'Itegro-GmbH/code-reviewer' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          APP_RESULT: ${{ needs.promote-app.result }}
          APP_DEPLOYMENT_ID: ${{ needs.stage-app.outputs.deployment-id }}
          APP_URL: ${{ needs.stage-app.outputs.url }}
          DISPATCHER_RESULT: ${{ needs.promote-dispatcher.result }}
          DISPATCHER_DEPLOYMENT_ID: ${{ needs.stage-dispatcher.outputs.deployment-id }}
          DISPATCHER_URL: ${{ needs.stage-dispatcher.outputs.url }}
          FACTORY_RESULT: ${{ needs.promote-factory.result }}
          FACTORY_DEPLOYMENT_ID: ${{ needs.stage-factory.outputs.deployment-id }}
          FACTORY_URL: ${{ needs.stage-factory.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const stages = [
              ['app', process.env.APP_RESULT, process.env.APP_DEPLOYMENT_ID, process.env.APP_URL],
              ['dispatcher', process.env.DISPATCHER_RESULT, process.env.DISPATCHER_DEPLOYMENT_ID, process.env.DISPATCHER_URL],
              // Empty when the factory lane is off: the stage did not run, so there is no deployment to close.
              ['factory', process.env.FACTORY_RESULT, process.env.FACTORY_DEPLOYMENT_ID, process.env.FACTORY_URL],
            ];
            for (const [project, result, id, url] of stages) {
              if (!id) continue;
              const promoted = result === 'success';
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: Number(id),
                state: promoted ? 'success' : result === 'cancelled' ? 'inactive' : 'failure',
                environment: `${project}-production`,
                ...(promoted && url ? { environment_url: url } : {}),
                log_url: process.env.RUN_URL,
                description: promoted
                  ? 'Promoted to production.'
                  : 'Not promoted; production stays on the previous deployment.',
                auto_inactive: promoted,
              });
            }
