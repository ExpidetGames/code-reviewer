# Builds both images from this checkout (no image is published):
#   docker compose -f compose.yml -f compose.build.yml up -d --build --wait
# The images are tagged locally; nothing is pushed.
services:
  app:
    image: code-reviewer-app:local
    build:
      context: .
      dockerfile: app/Dockerfile
  runner:
    image: code-reviewer-runner:local
    build:
      context: .
      dockerfile: runner/Dockerfile
